# Fails the build when the committed build/ folder is not what the definitions
# generate today. Copy to .github/workflows/ in your definitions repository.
name: ingestron check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes ingestron@1 check
