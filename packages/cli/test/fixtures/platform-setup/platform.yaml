apiVersion: ingestron.io/v1
kind: Platform
id: hr-lakehouse
tags:
  cost_centre: "4410"
  data_classification: confidential
schedule:
  cron: 0 0 2 * * ?
alerts:
  - { kind: email, to: [hr-data@example.com], on: [failure] }
databricks:
  workspace:
    host: https://adb-3000000000000003.3.azuredatabricks.net
  run_as:
    service_principal_name: 0b6c3d2e-0000-4000-8000-000000000007
  compute:
    budget_policy_id: 4e1d0c5b-hr-budget
  permissions:
    - { group_name: hr-data-engineers, level: CAN_MANAGE }
    - { group_name: hr-analysts, level: CAN_VIEW }
  manage:
    schemas: true # this project owns its schemas
  grants:
    bronze:
      - { principal: hr-data-engineers, privileges: [USE_SCHEMA, SELECT, MODIFY] }
