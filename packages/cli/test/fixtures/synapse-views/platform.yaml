apiVersion: ingestron.io/v1
kind: Platform
id: azure
settings:
  adf-copy: # shared infrastructure, referenced by name
    landing: ${values.landing}
    key_vault: ${values.key_vault}
    integration_runtime: shir-erp
  synapse-view: # the external data source the views read through
    data_source: landing
    data_source_location: ${values.storage}
