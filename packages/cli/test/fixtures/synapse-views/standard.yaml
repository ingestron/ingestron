apiVersion: ingestron.io/v1
kind: Standard
id: sales
packs: [synapse@1, adf@1] # Synapse first: it provides the defaults
store:
  default: synapse-view # each table is a view over the files ADF lands
ingest:
  settings:
    adf-copy:
      layout: snapshot # one file per table, replaced by each load
      every: { frequency: Hour, interval: 24 }
      start: 2026-10-01T00:00:00Z
