# The same ERP as the sql-server starter, but the workspace cannot reach it. ADF copies
# the changed rows through a self-hosted integration runtime into a landing
# folder; Databricks keeps the tables current from those files.
id: erp
environments:
  dev:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: REPLACE_ME
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: REPLACE_ME
  prod:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: REPLACE_ME
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: REPLACE_ME
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - contracts/*.yaml
