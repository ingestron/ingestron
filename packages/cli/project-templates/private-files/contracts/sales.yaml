apiVersion: v3.1.0
kind: DataContract
id: stores.sales
version: 1.0.0
status: active
schema:
  - name: sales
    logicalType: object
    description: One row per sale, exported by each store every hour.
    properties:
      - { name: sale_id, logicalType: string, required: true, primaryKey: true }
      - { name: store_id, logicalType: integer, required: true }
      - { name: amount, logicalType: number, physicalType: "DECIMAL(18,2)" }
      - { name: sold_at, logicalType: timestamp, required: true }
