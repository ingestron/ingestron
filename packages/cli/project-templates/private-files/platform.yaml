apiVersion: ingestron.io/v1
kind: Platform
id: lakehouse
schedule:
  cron: 0 15 * * * ?
  timezone: UTC
settings:
  adf-files: # shared infrastructure, referenced by name
    # Landing folder: the landing container of each environment's storage account
    landing: abfss://landing@${values.storage_account}.dfs.core.windows.net/stores
    key_vault: https://${values.key_vault}.vault.azure.net
    # The self-hosted integration runtime in the data factory that reaches the share
    integration_runtime: REPLACE_ME
