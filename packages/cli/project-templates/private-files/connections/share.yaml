apiVersion: ingestron.io/v1
kind: Connection
id: share
description: The stores' export share, inside the corporate network only.
connector: files
connectivity: private
settings:
  # The share, such as \\fs01\exports
  path: REPLACE_ME
  # The account that reads the share, such as corp\ingest
  user: REPLACE_ME
  # Key Vault secret: the account's password
  password: ${secret:stores-share-password}
