apiVersion: v3.1.0
kind: DataContract
id: shop.orders
version: 1.0.0
status: active
schema:
  - name: orders
    logicalType: object
    description: One row per order.
    properties:
      - { name: id, logicalType: integer, required: true, primaryKey: true }
      - { name: customer_id, logicalType: integer }
      - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
      - { name: ordered_at, logicalType: timestamp }
