$schema: https://json-schema.org/draft/2020-12/schema
title: Connection
description: A source that flows read from.
type: object
additionalProperties: false
required: [apiVersion, kind, id, connector, connectivity]
properties:
  apiVersion: { const: ingestron.io/v1, description: Always ingestron.io/v1. }
  kind: { const: Connection, description: The document kind. }
  id:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: Name that flows use in `source`.
    examples:
      - shop
  description:
    {
      type: string,
      description: "What this document is for, in a sentence.",
      examples: [Files the web shop exports every hour.],
    }
  connector:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: Connector type, such as `files`. The pack lists which methods can read it.
    examples:
      - files
  connectivity:
    enum: [public, workspace, private]
    enumDescriptions:
      - The data platform reaches the source directly.
      - The platform reaches it over private networking, such as ExpressRoute or a peered network.
      - The platform cannot reach it; something inside the source's network must bring the data.
    description: How the data platform reaches the source. Standards choose methods by this.
  settings:
    type: object
    description: Connector settings, such as `path` for files. Write secrets as `${secret:…}`.
