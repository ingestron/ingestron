$schema: https://json-schema.org/draft/2020-12/schema
title: Flow
description: >-
  Brings tables from one connection into the platform. The standard chooses how, unless `ingest` or
  `store` names a method.
type: object
additionalProperties: false
required: [apiVersion, kind, id, source, tables]
properties:
  apiVersion: { const: ingestron.io/v1, description: Always ingestron.io/v1. }
  kind: { const: Flow, description: The document kind. }
  id:
    {
      type: string,
      pattern: "^[a-z][a-z0-9_]*$",
      description: "The flow's id: lowercase letters, digits and underscores.",
      examples: [shop],
    }
  description:
    {
      type: string,
      description: "What this document is for, in a sentence.",
      examples: [Orders and customers from the web shop.],
    }
  source: { type: string, description: Id of the Connection to read from., examples: [shop] }
  layer:
    {
      type: string,
      description: "Layer the tables land in. Default: the standard's first layer.",
      examples: [bronze],
    }
  load:
    {
      $ref: "#/$defs/load",
      description: "How data leaves the source, for every table of this flow.",
    }
  history:
    {
      $ref: "#/$defs/history",
      description: "What is kept per key, for every table of this flow. Default: the layer's.",
    }
  sequence:
    {
      type: string,
      description: "The column that orders changes to a key. Default: the load cursor.",
      examples: [updated_at],
    }
  audit:
    {
      $ref: "#/$defs/audit",
      description: "Audit columns for every table of this flow, after the contract's columns.",
    }
  tables:
    type: object
    minProperties: 1
    description: The tables to bring in, by table name.
    propertyNames: { pattern: "^[a-z][a-z0-9_]*$" }
    additionalProperties:
      type: object
      additionalProperties: false
      required: [object, contract]
      properties:
        object:
          { type: string, description: The table or file path at the source., examples: [orders] }
        contract:
          {
            type: string,
            description: Id of the DataContract (ODCS) for this table.,
            examples: [shop.orders],
          }
        expectations:
          { $ref: "#/$defs/expectations", description: Your own checks on this table's rows. }
        cleanse:
          {
            $ref: "#/$defs/cleanse",
            description: "Cleansing for this table's columns, and deduplicate.",
          }
        load:
          { $ref: "#/$defs/load", description: "How data leaves the source, for this table only." }
        history:
          { $ref: "#/$defs/history", description: "What is kept per key, for this table only." }
        sequence:
          {
            type: string,
            description: "The column that orders changes to a key, for this table only.",
            examples: [updated_at],
          }
        audit:
          {
            $ref: "#/$defs/audit",
            description: "Audit columns for this table only, after the contract's columns.",
          }
        ingest: { $ref: "#/$defs/with", description: Method settings for this table only. }
        store: { $ref: "#/$defs/with", description: Method settings for this table only. }
        serve: { $ref: "#/$defs/with", description: Method settings for this table only. }
    examples:
      - orders:
          object: orders
          contract: shop.orders
  ingest: { $ref: "#/$defs/ingest", description: How data leaves the source. }
  store: { $ref: "#/$defs/store", description: How data is kept in the platform. }
  serve:
    { $ref: "#/$defs/serve", description: Where the data is made available after its last step. }
$defs:
  cleanse:
    type: object
    additionalProperties: false
    properties:
      columns:
        type: object
        description: "Cleansing for named columns of the contract, applied in this order after the cast: timezone, trim, empty, map, case, default."
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            timezone:
              description: "Converts a timestamp column to another time zone, before the other operations. `false` takes away the standard's rule for this column."
              oneOf:
                - { const: false }
                - type: object
                  additionalProperties: false
                  required: [to]
                  properties:
                    from:
                      type: string
                      description: "The zone the column is in. Default: the zone of the table's inputs."
                      examples: [Europe/London]
                    to:
                      type: string
                      description: The zone to convert to, such as `UTC`.
                      examples: [UTC]
              examples:
                - { to: UTC }
                - { from: Europe/London, to: UTC }
            trim:
              type: boolean
              description: "`true` removes leading and trailing whitespace; `false` takes away the standard's trim for this column."
            empty:
              enum: [null, false]
              description: "`null` turns an empty string into null; `false` takes away the standard's rule for this column."
              enumDescriptions:
                - Turn an empty string into null.
                - Leave empty strings as they are.
            map:
              type: object
              description: "Replaces each key with its value where the column holds exactly the key. Keys and values must fit the column's type."
              additionalProperties: { type: [string, number, boolean, "null"] }
              examples:
                - { GBR: GB, United Kingdom: GB }
            case:
              enum: [upper, lower]
              description: Change text to upper or lower case.
              enumDescriptions:
                - Upper case.
                - Lower case.
            default:
              type: [string, number, boolean]
              description: "Replaces null with this value, which must fit the column's type."
              examples: [unknown]
        examples:
          - email: { case: lower }
            status: { default: unknown }
      deduplicate:
        type: object
        additionalProperties: false
        required: [order_by]
        description: "Keeps one row for each primary key of the contract: the last by `order_by`. The table's layer must do `deduplicate`, and its store must not append."
        properties:
          order_by:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string }
            description: Contract columns that order the rows of a key; the row that comes last is kept.
            examples:
              - [updated_at]
  loadMode:
    enum: [files, incremental, changes, full]
    enumDescriptions:
      - New files only, each read once.
      - Rows whose cursor column is past the last value seen.
      - The source's change log or change feed.
      - The whole object each run; any history is derived by comparing snapshots.
  load:
    type: object
    additionalProperties: false
    properties:
      mode:
        {
          $ref: "#/$defs/loadMode",
          description: "How data leaves the source. Default: the standard's.",
        }
      cursor:
        {
          type: string,
          description: "The column that grows as rows arrive, for the `incremental` mode.",
          examples: [updated_at],
        }
      deletes:
        type: object
        additionalProperties: false
        description: "What happens to a row deleted at the source."
        properties:
          mode:
            enum: [soft, hard, keep]
            description: "How a delete is treated. Default: the standard's."
            enumDescriptions:
              - Deleted rows are marked and kept.
              - Deleted rows are removed.
              - Deletes at the source are ignored.
          when:
            {
              type: string,
              description: "A SQL condition that is true for a row that was deleted at the source.",
              examples: ["op = 'D'"],
            }
  history:
    enum: [none, latest, full, bitemporal]
    enumDescriptions:
      - Every row as it arrived.
      - Only the latest row per key.
      - Every version of each key, with when it applied.
      - Every version with both valid time and recorded time. Preview on some platforms.
  audit:
    type: array
    uniqueItems: true
    items:
      oneOf:
        - { $ref: "#/$defs/auditValue" }
        - type: object
          additionalProperties: false
          required: [value, as]
          properties:
            value: { $ref: "#/$defs/auditValue", description: "The audit value this column holds." }
            as:
              {
                type: string,
                pattern: "^[a-z_][a-z0-9_]*$",
                description: "The column's name. Default: the value's name with a leading underscore.",
                examples: [_ingested_at],
              }
    examples:
      - - loaded_at
        - value: source_file
          as: _file
  auditValue:
    enum:
      - loaded_at
      - run_id
      - source_file
      - source_modified_at
      - source_object
      - source_connection
      - window_start
      - window_end
      - row_hash
    enumDescriptions:
      - When the row was written to the table.
      - The id of the run that wrote the row.
      - The file the row was read from.
      - When the file the row was read from was last changed.
      - The object at the source the row came from.
      - The connection the row came from.
      - The start of the window of source data the run read.
      - The end of the window of source data the run read.
      - A hash of the row's values.
  with:
    type: object
    additionalProperties: false
    properties:
      with:
        {
          type: object,
          description: "Settings for the chosen method, over the standard's.",
          examples: [{ format: csv, options: { header: true } }],
        }
  expectations:
    type: array
    description: Data quality checks on each row.
    items:
      type: object
      additionalProperties: false
      required: [name, check]
      properties:
        name:
          {
            type: string,
            pattern: "^[a-z][a-z0-9_]*$",
            description: "A name for the check: lowercase letters, digits and underscores.",
            examples: [positive_total],
          }
        check:
          {
            type: string,
            description: "A SQL condition every valid row meets, such as `total >= 0`.",
            examples: [total >= 0],
          }
        action:
          enum: [warn, drop, fail]
          description: "What happens to a row that fails. Default: the standard's `quality.default`."
          enumDescriptions:
            - Keep the row and record that it failed.
            - Leave the row out of the table.
            - Stop the update.
  ingest:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A method the standard allows. Leave out to let the standard choose.
        examples:
          - files
      with:
        type: object
        description: Method settings for every table of this flow.
  store:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A method the standard allows, or none to end the flow at the files ingest lands. Leave out to let the standard choose.
        examples:
          - streaming-table
          - none
      with:
        type: object
        description: Method settings for every table of this flow.
  serve:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A serve method the standard allows, such as views over the data. Leave out to let the standard choose; nothing is served unless something chooses.
        examples:
          - synapse-serve
      with:
        type: object
        description: Method settings for every table of this flow.
