$schema: https://json-schema.org/draft/2020-12/schema
title: Flow
description: >-
  Brings tables from one connection into the platform. The standard chooses how, unless `ingest` or
  `store` names a method.
type: object
additionalProperties: false
required: [apiVersion, kind, id, source, tables]
properties:
  apiVersion: { const: ingestron.io/v1, description: Always ingestron.io/v1. }
  kind: { const: Flow, description: The document kind. }
  id:
    {
      type: string,
      pattern: "^[a-z][a-z0-9_]*$",
      description: "The flow's id: lowercase letters, digits and underscores.",
      examples: [shop],
    }
  description:
    {
      type: string,
      description: "What this document is for, in a sentence.",
      examples: [Orders and customers from the web shop.],
    }
  source: { type: string, description: Id of the Connection to read from., examples: [shop] }
  layer:
    {
      type: string,
      description: "Layer the tables land in. Default: the standard's first layer.",
      examples: [bronze],
    }
  load:
    {
      $ref: "#/$defs/load",
      description: "How data leaves the source, for every table of this flow.",
    }
  history:
    {
      $ref: "#/$defs/history",
      description: "What is kept per key, for every table of this flow. Default: the layer's.",
    }
  sequence:
    {
      type: string,
      description: "The column that orders changes to a key. Default: the load cursor.",
      examples: [updated_at],
    }
  audit:
    {
      $ref: "#/$defs/audit",
      description: "Audit columns for every table of this flow, after the contract's columns.",
    }
  tables:
    type: object
    minProperties: 1
    description: The tables to bring in, by table name.
    propertyNames: { pattern: "^[a-z][a-z0-9_]*$" }
    additionalProperties:
      type: object
      additionalProperties: false
      required: [object]
      properties:
        object:
          { type: string, description: The table or file path at the source., examples: [orders] }
        contract:
          {
            type: string,
            description: "Id of the DataContract (ODCS) for this table. Optional when the table's columns come from source metadata.",
            examples: [shop.orders],
          }
        expectations:
          { $ref: "#/$defs/expectations", description: Your own checks on this table's rows. }
        quality:
          {
            type: object,
            additionalProperties: false,
            description: "Quarantine and results for this table only.",
            properties:
              {
                quarantine:
                  {
                    type: boolean,
                    description: "Whether rows that fail a check with the action `drop` are kept in a table of their own, `<table>_quarantine`. The table's layer must list `quarantine` in its `does`.",
                  },
                results:
                  {
                    type: boolean,
                    description: "Whether the results of this table's checks are kept as a table that can be queried.",
                  },
              },
          }
        cleanse:
          {
            $ref: "#/$defs/cleanse",
            description: "Cleansing for this table's columns, and deduplicate.",
          }
        load:
          { $ref: "#/$defs/load", description: "How data leaves the source, for this table only." }
        history:
          { $ref: "#/$defs/history", description: "What is kept per key, for this table only." }
        sequence:
          {
            type: string,
            description: "The column that orders changes to a key, for this table only.",
            examples: [updated_at],
          }
        audit:
          {
            $ref: "#/$defs/audit",
            description: "Audit columns for this table only, after the contract's columns.",
          }
        ingest:
          {
            $ref: "#/$defs/tableIngest",
            description: "How data leaves the source, for this table only.",
          }
        store: { $ref: "#/$defs/with", description: Method settings for this table only. }
        serve: { $ref: "#/$defs/with", description: Method settings for this table only. }
    examples:
      - orders:
          object: orders
          contract: shop.orders
  ingest: { $ref: "#/$defs/ingest", description: How data leaves the source. }
  store: { $ref: "#/$defs/store", description: How data is kept in the platform. }
  serve:
    { $ref: "#/$defs/serve", description: Where the data is made available after its last step. }
$defs:
  duration:
    type: string
    pattern: "^[0-9]+(s|m|h|d)$"
    description: A length of time, a whole number then `s`, `m`, `h` or `d`.
    examples: [30s, 5m, 2h, 1d]
  parameter:
    type: object
    description: A custom pipeline parameter, named by its key, with its type and the value a run uses when no trigger sets it.
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [string, int, float, bool, date, datetime]
        description: The type of the parameter's value.
        enumDescriptions:
          - Text.
          - A whole number.
          - A number with a fraction.
          - true or false.
          - A date written YYYY-MM-DD.
          - A date and time in ISO 8601, such as 2026-12-01T02:00:00Z.
      default:
        type: [string, number, boolean]
        description: The value a run uses when no trigger sets the parameter. Required; leaving it out is reported with the parameter's name.
        examples: ["2020-01-01"]
    examples:
      - { type: date, default: "2020-01-01" }
  parameterValue:
    description: 'A literal, or `{ expression: "..." }` for an expression the pipeline evaluates when the trigger starts it.'
    oneOf:
      - type: [string, number, boolean]
      - type: object
        additionalProperties: false
        required: [expression]
        properties:
          expression:
            type: string
            description: "An expression written as the platform has it, such as `@trigger().scheduledTime`."
            examples: ["@formatDateTime(addDays(trigger().scheduledTime, -30), 'yyyy-MM-dd')"]
  weekday:
    enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    enumDescriptions:
      - The first day of the week.
      - The second day of the week.
      - The third day of the week.
      - The fourth day of the week.
      - The fifth day of the week.
      - The sixth day of the week.
      - The last day of the week.
  trigger:
    type: object
    additionalProperties: false
    required: [name, type, every, start]
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
        description: "The trigger's name, unique within the flow: lowercase letters, digits, hyphens and underscores."
        examples: [hourly]
      type:
        enum: [schedule, tumbling-window]
        description: "What kind of trigger this is."
        enumDescriptions:
          - Runs at the times the recurrence gives.
          - Runs once for each fixed, contiguous window of time, passing the window to the pipeline.
      every:
        type: object
        additionalProperties: false
        required: [frequency, interval]
        description: How often the trigger repeats.
        properties:
          frequency:
            enum: [Minute, Hour, Day, Week, Month]
            description: The unit of the interval.
            enumDescriptions:
              - Every so many minutes.
              - Every so many hours.
              - Every so many days.
              - Every so many weeks.
              - Every so many months.
          interval:
            type: integer
            minimum: 1
            maximum: 1000
            description: How many units between runs, from 1 to 1000.
            examples: [1]
        examples:
          - { frequency: Hour, interval: 1 }
      start:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?(Z|[+-][0-9]{2}(:?[0-9]{2})?)?$"
        description: "When the trigger may first start, an ISO 8601 date and time: `YYYY-MM-DDTHH:mm`, optional `:ss`, then `Z` or an offset for a fixed instant, or nothing for a time in the trigger's zone."
        examples: [2026-12-01T00:00:00Z]
      end:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?(Z|[+-][0-9]{2}(:?[0-9]{2})?)?$"
        description: "When the trigger stops starting runs, an ISO 8601 date and time written as `start` is. Default: never."
        examples: [2027-12-01T00:00:00Z]
      timezone:
        type: string
        description: "The IANA zone the trigger's times are in. Default: the standard's `operations.triggers.timezone`, else UTC."
        examples: [Europe/London]
      at:
        type: object
        additionalProperties: false
        description: "Schedule only: the times within each repeat that the trigger starts."
        properties:
          minutes:
            type: array
            items: { type: integer, minimum: 0, maximum: 59 }
            description: Minutes of the hour.
            examples: [[0, 30]]
          hours:
            type: array
            items: { type: integer, minimum: 0, maximum: 23 }
            description: Hours of the day.
            examples: [[2]]
          weekdays:
            type: array
            items: { $ref: "#/$defs/weekday" }
            description: Days of the week. Needs a `Week` frequency.
            examples: [[Sunday]]
          month_days:
            type: array
            items: { type: integer }
            description: Days of the month; a negative number counts from the end. Needs a `Month` frequency.
            examples: [[1, -1]]
          occurrences:
            type: array
            description: A weekday of the month, such as the first Monday. Needs a `Month` frequency.
            items:
              type: object
              additionalProperties: false
              required: [day]
              properties:
                day: { $ref: "#/$defs/weekday", description: "The day of the week." }
                occurrence:
                  type: integer
                  description: "Which one in the month; a negative number counts from the end. Default: every one."
                  examples: [1]
            examples:
              - [{ day: Monday, occurrence: 1 }]
        examples:
          - { weekdays: [Sunday], hours: [2], minutes: [0] }
      lookback:
        {
          $ref: "#/$defs/duration",
          description: "Schedule only: how far back each run reads, so runs overlap on purpose.",
        }
      delay:
        {
          $ref: "#/$defs/duration",
          description: "Tumbling window only: how long after a window ends its run starts.",
        }
      concurrency:
        type: integer
        minimum: 1
        maximum: 50
        description: "Tumbling window only: how many windows may run at once, from 1 to 50. Default: the standard's `operations.concurrency.max_runs`."
        examples: [1]
      retries:
        type: object
        additionalProperties: false
        required: [count, interval]
        description: "Tumbling window only: how a failed window is tried again. Default: the standard's `operations.retries`."
        properties:
          count:
            type: integer
            minimum: 0
            description: How many times to try again.
            examples: [3]
          interval: { $ref: "#/$defs/duration", description: "How long to wait between tries." }
        examples:
          - { count: 3, interval: 300s }
      depends_on:
        type: array
        description: "Tumbling window only: the windows this trigger waits for."
        items:
          oneOf:
            - type: object
              additionalProperties: false
              required: [self, offset]
              properties:
                self: { const: true, description: The trigger's own earlier window. }
                offset:
                  type: string
                  pattern: "^-[0-9]+(s|m|h|d)$"
                  description: How far back the window is, a negative duration.
                  examples: [-1h]
                size:
                  {
                    $ref: "#/$defs/duration",
                    description: "How long the window is. Default: the trigger's own.",
                  }
            - type: object
              additionalProperties: false
              required: [trigger]
              properties:
                trigger:
                  type: string
                  description: "A tumbling-window trigger of this flow by name, or of another flow as `<flow>/<name>`."
                  examples: [orders/hourly]
                offset:
                  type: string
                  pattern: "^-?[0-9]+(s|m|h|d)$"
                  description: "How far the window is from this trigger's. Default: the same window."
                  examples: [-1h]
                size:
                  {
                    $ref: "#/$defs/duration",
                    description: "How long the window is. Default: the trigger's own.",
                  }
        examples:
          - [{ self: true, offset: -1h }]
      backfill:
        type: boolean
        description: "Tumbling window only: true to run the windows between `start` and now when the trigger is new to the project."
        examples: [false]
      paused:
        type: boolean
        description: "True to keep the trigger stopped in every environment."
        examples: [false]
      parameters:
        type: object
        description: "The values this trigger gives the pipeline's parameters: `load`, `windowStart` and `windowEnd`, and the flow's own."
        additionalProperties: { $ref: "#/$defs/parameterValue" }
        examples:
          - load: full
    examples:
      - name: weekly-reload
        type: schedule
        every: { frequency: Week, interval: 1 }
        start: 2026-12-01T00:00:00Z
        at: { weekdays: [Sunday], hours: [2], minutes: [0] }
        parameters: { load: full }
  cleanse:
    type: object
    additionalProperties: false
    properties:
      columns:
        type: object
        description: "Cleansing for named columns of the contract, applied in this order after the cast: timezone, trim, empty, map, case, default."
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            timezone:
              description: "Converts a timestamp column to another time zone, before the other operations. `false` takes away the standard's rule for this column."
              oneOf:
                - { const: false }
                - type: object
                  additionalProperties: false
                  required: [to]
                  properties:
                    from:
                      type: string
                      description: "The zone the column is in. Default: the zone of the table's inputs."
                      examples: [Europe/London]
                    to:
                      type: string
                      description: The zone to convert to, such as `UTC`.
                      examples: [UTC]
              examples:
                - { to: UTC }
                - { from: Europe/London, to: UTC }
            trim:
              type: boolean
              description: "`true` removes leading and trailing whitespace; `false` takes away the standard's trim for this column."
            empty:
              enum: [null, false]
              description: "`null` turns an empty string into null; `false` takes away the standard's rule for this column."
              enumDescriptions:
                - Turn an empty string into null.
                - Leave empty strings as they are.
            map:
              type: object
              description: "Replaces each key with its value where the column holds exactly the key. Keys and values must fit the column's type."
              additionalProperties: { type: [string, number, boolean, "null"] }
              examples:
                - { GBR: GB, United Kingdom: GB }
            case:
              enum: [upper, lower]
              description: Change text to upper or lower case.
              enumDescriptions:
                - Upper case.
                - Lower case.
            default:
              type: [string, number, boolean]
              description: "Replaces null with this value, which must fit the column's type."
              examples: [unknown]
        examples:
          - email: { case: lower }
            status: { default: unknown }
      deduplicate:
        type: object
        additionalProperties: false
        required: [order_by]
        description: "Keeps one row for each primary key of the contract: the last by `order_by`. The table's layer must do `deduplicate`, and its store must not append."
        properties:
          order_by:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string }
            description: Contract columns that order the rows of a key; the row that comes last is kept.
            examples:
              - [updated_at]
  loadMode:
    enum: [files, incremental, changes, full]
    enumDescriptions:
      - New files only, each read once.
      - Rows whose cursor column is past the last value seen.
      - The source's change log or change feed.
      - The whole object each run; any history is derived by comparing snapshots.
  load:
    type: object
    additionalProperties: false
    properties:
      mode:
        {
          $ref: "#/$defs/loadMode",
          description: "How data leaves the source. Default: the standard's.",
        }
      cursor:
        {
          type: string,
          description: "The column that grows as rows arrive, for the `incremental` mode.",
          examples: [updated_at],
        }
      deletes:
        type: object
        additionalProperties: false
        description: "What happens to a row deleted at the source."
        properties:
          mode:
            enum: [soft, hard, keep]
            description: "How a delete is treated. Default: the standard's."
            enumDescriptions:
              - Deleted rows are marked and kept.
              - Deleted rows are removed.
              - Deletes at the source are ignored.
          when:
            {
              type: string,
              description: "A SQL condition that is true for a row that was deleted at the source.",
              examples: ["op = 'D'"],
            }
  history:
    enum: [none, latest, full, bitemporal]
    enumDescriptions:
      - Every row as it arrived.
      - Only the latest row per key.
      - Every version of each key, with when it applied.
      - Every version with both valid time and recorded time. Preview on some platforms.
  audit:
    type: array
    uniqueItems: true
    items:
      oneOf:
        - { $ref: "#/$defs/auditValue" }
        - type: object
          additionalProperties: false
          required: [value, as]
          properties:
            value: { $ref: "#/$defs/auditValue", description: "The audit value this column holds." }
            as:
              {
                type: string,
                pattern: "^[a-z_][a-z0-9_]*$",
                description: "The column's name. Default: the value's name with a leading underscore.",
                examples: [_ingested_at],
              }
    examples:
      - - loaded_at
        - value: source_file
          as: _file
  auditValue:
    enum:
      - loaded_at
      - run_id
      - source_file
      - source_modified_at
      - source_object
      - source_connection
      - window_start
      - window_end
      - row_hash
    enumDescriptions:
      - When the row was written to the table.
      - The id of the run that wrote the row.
      - The file the row was read from.
      - When the file the row was read from was last changed.
      - The object at the source the row came from.
      - The connection the row came from.
      - The start of the window of source data the run read.
      - The end of the window of source data the run read.
      - A hash of the row's values.
  with:
    type: object
    additionalProperties: false
    properties:
      with:
        {
          type: object,
          description: "Settings for the chosen method, over the standard's.",
          examples: [{ format: csv, options: { header: true } }],
        }
  tableIngest:
    type: object
    additionalProperties: false
    properties:
      with:
        {
          type: object,
          description: "Settings for the chosen method, over the standard's.",
          examples: [{ format: csv, options: { header: true } }],
        }
      filter:
        type: string
        minLength: 1
        description: "A predicate in the source's SQL dialect that limits the source rows this table reads, for a method that filters. It may hold `{{ parameters.<name> }}`, a parameter the flow declares under `ingest.parameters`, in plain SQL code only: not inside quotes, a quoted name or a comment."
        examples:
          - "OrderDate >= {{ parameters.min_date }}"
  expectations:
    type: array
    description: Data quality checks on each row.
    items:
      type: object
      additionalProperties: false
      required: [name, check]
      properties:
        name:
          {
            type: string,
            pattern: "^[a-z][a-z0-9_]*$",
            description: "A name for the check: lowercase letters, digits and underscores.",
            examples: [positive_total],
          }
        check:
          {
            type: string,
            description: "A SQL condition every valid row meets, such as `total >= 0`.",
            examples: [total >= 0],
          }
        action:
          enum: [warn, drop, fail]
          description: "What happens to a row that fails. Default: the standard's `quality.default`."
          enumDescriptions:
            - Keep the row and record that it failed.
            - Leave the row out of the table.
            - Stop the update.
  ingest:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A method the standard allows. Leave out to let the standard choose.
        examples:
          - files
      with:
        type: object
        description: Method settings for every table of this flow.
      parameters:
        type: object
        description: "Custom pipeline parameters of this flow, by name: lowercase letters, digits and underscores. A trigger sets each one, and a run that no trigger sets uses the default."
        additionalProperties: { $ref: "#/$defs/parameter" }
        examples:
          - min_date: { type: date, default: "2020-01-01" }
      triggers:
        type: array
        description: "What starts the flow's pipeline, when the standard lets flows write triggers (`operations.schedule.per: flow`). Leave out to keep the pack's default trigger."
        items: { $ref: "#/$defs/trigger" }
        examples:
          - - name: hourly
              type: tumbling-window
              every: { frequency: Hour, interval: 1 }
              start: 2026-12-01T00:00:00Z
  store:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A method the standard allows, or none to end the flow at the files ingest lands. Leave out to let the standard choose.
        examples:
          - streaming-table
          - none
      with:
        type: object
        description: Method settings for every table of this flow.
  serve:
    type: object
    additionalProperties: false
    properties:
      uses:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        description: A serve method the standard allows, such as views over the data. Leave out to let the standard choose; nothing is served unless something chooses.
        examples:
          - synapse-serve
      with:
        type: object
        description: Method settings for every table of this flow.
