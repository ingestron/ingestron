# Where this project's assets go. Values differ per environment.
apiVersion: ingestron.io/v1
kind: Platform
id: lakehouse
tags:
  team: sales
  environment: ${environment.name}
schedule:
  cron: 0 0 5 * * ? # Quartz cron: the refresh job runs once a day
  timezone: UTC # the time zone the cron is read in
alerts:
  - { kind: email, to: ["${values.on_failure}"], on: [failure] }
databricks:
  workspace:
    host: ${values.host}
  run_as:
    service_principal_name: ${values.run_as}
  permissions:
    - group_name: ${values.engineers}
      level: CAN_MANAGE
    - group_name: ${values.analysts}
      level: CAN_VIEW
