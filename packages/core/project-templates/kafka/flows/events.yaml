apiVersion: ingestron.io/v1
kind: Flow
id: events
source: events
# Keep every message as it arrives, whichever ingestion method the route chooses.
history: none
ingest:
  # One bundle covers every environment, so how the pipeline runs is the same in each.
  with: { starting_offset: earliest, continuous: false }
tables:
  page_views:
    # The topic
    object: REPLACE_ME
    contract: web.page_views
  purchases:
    # The topic
    object: REPLACE_ME
    contract: web.purchases
