# Store exports on a file share inside the corporate network. ADF copies new
# files through a self-hosted integration runtime into a landing folder as
# they are; Databricks reads them there with Auto Loader.
id: stores
environments:
  dev:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: REPLACE_ME
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: REPLACE_ME
  prod:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: REPLACE_ME
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: REPLACE_ME
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - contracts/*.yaml
