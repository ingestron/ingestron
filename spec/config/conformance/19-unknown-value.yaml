description: A reference to a value that does not exist lists the available names.
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    values:
      catalog: main
      schema: raw
    imports: ["*.pipeline.yaml"]
  a.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: a
    catalog: ${values.catalgo}
    where: ${environment.name}
    list: "${values.catalog} ${file:list.yaml}"
  list.yaml: |
    [1, 2]
expect:
  diagnostics:
    - code: UNKNOWN_VALUE
      line: 4
      message: '"${values.catalgo}" has no value: "catalgo" is not defined.'
      hint: "Available here: catalog, schema."
    - { code: NO_ENVIRONMENT, line: 5 }
    - { code: NOT_TEXT, line: 6 }
