description: With no environment selected, no .env.<environment> file is read.
envvars: {}
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    environments:
      dev: {}
    imports: ["*.pipeline.yaml"]
  .env.dev: |
    ONLY_DEV=d
  a.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: a
    only: ${envvar:ONLY_DEV}
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: error, file: a.pipeline.yaml, line: 4 }
