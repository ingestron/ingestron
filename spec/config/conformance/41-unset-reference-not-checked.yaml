description: An unset reference is not checked, so only the information remains. Its value may have a pattern and an enum, sit in an anyOf or a link, or be copied from values into other text.
envvars: {}
missingEnvvars: information
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema:
      type: object
      properties:
        url:
          { type: string, pattern: "^https://", enum: ["https://a.example", "https://b.example"] }
        landing: { type: string, pattern: "^abfss://", minLength: 40 }
        mode: { anyOf: [{ type: string, pattern: "^full$" }, { type: string, pattern: "^delta$" }] }
        target: { type: string }
    links: { /target: Target }
  - apiVersion: example.dev/v1
    kind: Target
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    values:
      lake: ${envvar:LAKE}
    imports: ["*.pipeline.yaml", "*.target.yaml"]
  a.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: a
    url: ${envvar:URL}
    landing: ${values.lake}/raw
    mode: ${envvar:MODE}
    target: ${envvar:TARGET}
  t.target.yaml: |
    apiVersion: example.dev/v1
    kind: Target
    id: t
expect:
  documents:
    - kind: Pipeline
      id: a
      value:
        apiVersion: example.dev/v1
        kind: Pipeline
        id: a
        url: "${envvar:URL}"
        landing: "${envvar:LAKE}/raw"
        mode: "${envvar:MODE}"
        target: "${envvar:TARGET}"
    - kind: Target
      id: t
      value: { apiVersion: example.dev/v1, kind: Target, id: t }
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: project.yaml, line: 3 }
    - { code: ENVVAR_MISSING, severity: information, file: a.pipeline.yaml, line: 4 }
    - { code: ENVVAR_MISSING, severity: information, file: a.pipeline.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: a.pipeline.yaml, line: 7 }
  unsetEnvvars: ["${envvar:LAKE}", "${envvar:URL}", "${envvar:MODE}", "${envvar:TARGET}"]
