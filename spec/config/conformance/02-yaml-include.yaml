description: ${file:…} inserts a value from another YAML file, keeping its type, and resolves references inside it.
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    values:
      key_type: bigint
    imports: ["pipelines/*.pipeline.yaml"]
  pipelines/orders.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: orders
    columns: ${file:../shared/columns.yaml#/orders}
  shared/columns.yaml: |
    orders:
      - { name: order_id, type: "${values.key_type}" }
      - { name: amount, type: decimal }
expect:
  documents:
    - kind: Pipeline
      id: orders
      value:
        apiVersion: example.dev/v1
        kind: Pipeline
        id: orders
        columns:
          - { name: order_id, type: bigint }
          - { name: amount, type: decimal }
