description: Embedding a secret in text is refused.
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    imports: ["*.pipeline.yaml"]
  a.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: a
    url: "jdbc://user:${secret:scope/pw}@host"
expect:
  diagnostics:
    - { code: SECRET_IN_TEXT, file: a.pipeline.yaml, line: 4, column: 6 }
