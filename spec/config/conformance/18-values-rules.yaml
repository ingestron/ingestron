description: Environments must exist; with none selected, values may still refer to other values.
environment: test
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    values:
      catalog: main
      table: ${values.catalog}_orders
    imports: ["*.pipeline.yaml"]
expect:
  diagnostics:
    - { code: UNKNOWN_ENVIRONMENT, file: project.yaml }
    - { code: NO_MATCH, severity: warning, file: project.yaml }
