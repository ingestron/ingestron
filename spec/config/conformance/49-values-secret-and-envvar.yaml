description: A secret passes through values as a whole value. An unset variable's text travels with the values built from it, and the variable is listed once, at the value it is written in.
missingEnvvars: information
kinds:
  - apiVersion: example.dev/v1
    kind: Pipeline
    schema: { type: object }
files:
  project.yaml: |
    id: sales
    values:
      password: ${secret:scope/pw}
      login: ${values.password}
      account: ${envvar:ACCOUNT}
      landing: abfss://landing@${values.account}.dfs.core.windows.net
    imports: ["*.pipeline.yaml"]
  a.pipeline.yaml: |
    apiVersion: example.dev/v1
    kind: Pipeline
    id: a
    login: ${values.login}
    landing: ${values.landing}
expect:
  documents:
    - kind: Pipeline
      id: a
      value:
        apiVersion: example.dev/v1
        kind: Pipeline
        id: a
        login: { $secret: scope/pw }
        landing: abfss://landing@${envvar:ACCOUNT}.dfs.core.windows.net
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: project.yaml, line: 5 }
  unsetEnvvars: ["${envvar:ACCOUNT}"]
  envvarReferences:
    - { name: ACCOUNT, file: project.yaml, pointer: /values/account, line: 5 }
