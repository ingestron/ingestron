description: "An AGENTS.md of the user's, with no marker, gets the section appended after one blank line, and what the user wrote stays as it was."
files:
  project.yaml: |
    id: local
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: defaults
    packs: [duckdb@2]
  AGENTS.md: |
    # Team notes

    Use British English in every message.
command: assistant
args: ["add", "agents"]
expect:
  exit: 0
  lines:
    - "AGENTS.md: added the Ingestron section"
  contains:
    AGENTS.md:
      - |
        # Team notes

        Use British English in every message.

        <!-- ingestron:begin guide 1. Ingestron writes this section and `ingestron apply` keeps it current. Write your own notes outside it, or delete both markers to make it yours. -->
        # Working on this Ingestron project
