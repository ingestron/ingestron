description: "A user's AGENTS.md with CRLF line endings and no final newline gets the section appended after one blank line in CRLF, and the hash is still that of the text read as LF."
files:
  project.yaml: |
    id: local
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: defaults
    packs: [duckdb@2]
  AGENTS.md: "# Notes\r\nKeep it short."
command: assistant
args: [add, agents]
expect:
  exit: 0
  lines:
    - "AGENTS.md: added the Ingestron section"
  contains:
    AGENTS.md:
      - "# Notes\r\nKeep it short.\r\n\r\n<!-- ingestron:begin guide 1. Ingestron writes this section and `ingestron apply` keeps it current. Write your own notes outside it, or delete both markers to make it yours. -->\r\n# Working on this Ingestron project\r\n\r\nThis folder holds"
      - "- `ingestron contract <sample>`: drafts a contract from a CSV or JSON sample.\r\n<!-- ingestron:end sha256:423f0f50de23c00bda2cfe489dde0e3a7a63f06b76312b85e68487d2cfcbc7d9 -->\r\n"
