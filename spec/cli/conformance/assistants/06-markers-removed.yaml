description: "An AGENTS.md without markers is the user's: apply says nothing about it and leaves it alone."
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2, local@1]
    store: { default: local-table }
    ingest:
      settings:
        local-landed: { landing: ./samples }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
  AGENTS.md: |
    # Notes

    Ingestron generates the files under build/. Do not edit them.
command: apply
expect:
  exit: 0
  lines:
    - "fold → build/fold (dev, prod)"
    - "local → build/local (dev, prod)"
  absentLines:
    - "AGENTS.md"
  unchanged:
    - AGENTS.md
