openapi: 3.1.0
info:
  title: Shop
  version: "1.0"
paths: {}
components:
  schemas:
    Address:
      type: object
      required: [street]
      properties:
        street: { type: string, maxLength: 120 }
        city: { type: string }
    Customer:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80, example: ZZ-SECRET-42 }
        email: { type: [string, "null"], default: ZZ-SECRET-42 }
        balance: { type: number, format: double }
        active: { type: boolean }
        born: { type: string, format: date }
        joined: { type: string, format: date-time }
        opens: { type: string, format: time }
        address: { $ref: "#/components/schemas/Address" }
        billing:
          type: object
          required: [iban]
          properties:
            iban: { type: string }
            bank: { $ref: "#/components/schemas/Address" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        tags:
          type: array
          items: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        parent: { $ref: "#/components/schemas/Customer" }
        external: { $ref: "other.json#/Thing" }
        status: { type: string, enum: [ZZ-SECRET-42] }
    Order:
      type: object
      properties:
        number: { type: string }
    Maybe:
      type: [object, "null"]
      properties:
        x: { type: string }
    Status:
      type: string
      enum: [open]
