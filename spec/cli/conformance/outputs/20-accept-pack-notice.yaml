description: "A pack's warning that an entry of every target's accept list accepts is not shown, and is counted with the accepted warnings; the pack's files are still written."
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    accept:
      - code: PACK_NOTICE
        reason: The platform team keeps the runtime's settings.
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
notices:
  - {
      message: "The runtime keeps settings the files do not write.",
      hint: "Check the runtime before the first deployment.",
    }
command: apply
expect:
  exit: 0
  lines:
    - "1 accepted warning (platform.yaml)"
    - "fold → build/fold (dev, prod)"
    - Applied.
  diagnostics: []
  folders:
    build/fold: [tables.txt, targets.txt]
