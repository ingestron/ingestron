description: "A ${envvar:…} is a deploy-time value for a pack that builds environments together, whatever the host sets, while a pack that does not reads the host's value."
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2, local@1]
    store: { default: local-table }
    ingest:
      settings:
        local-landed: { landing: ./samples }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: "${envvar:SHOP_PATH}" }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
envvars: { SHOP_PATH: /data/from-host }
command: apply
expect:
  exit: 0
  folders:
    build/fold: [tables.txt, targets.txt]
    build/local: [dev/tables.txt, prod/tables.txt]
  texts:
    build/fold/tables.txt: "orders ${envvar:SHOP_PATH}\n"
    build/local/dev/tables.txt: "orders /data/from-host\n"
