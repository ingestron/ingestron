description: "Environments may differ only in values: a table ingested by another method in one environment is ENVIRONMENTS_DIFFER, and nothing is written."
files:
  project.yaml: |
    id: retail
    environments: { dev: { values: { reader: fold-copy } }, prod: { values: { reader: fold-share } } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    ingest:
      uses: ${values.reader}
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
command: apply
expect:
  exit: 1
  lines:
    - "fold: the definitions have problems"
  diagnostics:
    - code: ENVIRONMENTS_DIFFER
      severity: error
      message: Table "orders" uses "fold-copy" for ingest in dev and "fold-share" in prod.
      hint: Environments may differ only in values, such as names, paths and hosts; make the rest the same in every environment.
      file: sales.yaml
      line: 6
      column: 1
  folders: {}
