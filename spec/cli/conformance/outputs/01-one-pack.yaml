description: "A pack that builds environments together writes one output folder, named after the pack, that covers every environment."
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
command: apply
expect:
  exit: 0
  lines:
    - "fold → build/fold (dev, test, prod)"
    - Applied.
  folders:
    build/fold: [tables.txt, targets.txt]
  texts:
    build/fold/tables.txt: "orders /data/shop\n"
    build/fold/targets.txt: "dev\ntest\nprod\n"
