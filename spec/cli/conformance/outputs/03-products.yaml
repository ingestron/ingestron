description: "Data product passports have their own output folder, build/products, beside the packs', with a folder per environment."
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
  sales-product.yaml: |
    apiVersion: v1.1.0
    kind: DataProduct
    id: sales
    name: Sales
    status: active
    description:
      purpose: Orders for reporting.
    team:
      members:
        - { username: ana@example.com, role: owner }
    outputPorts:
      - { name: orders, contractId: orders }
command: apply
expect:
  exit: 0
  lines:
    - "fold → build/fold (dev, prod)"
    - "products → build/products (dev, prod)"
  folders:
    build/fold: [tables.txt, targets.txt]
    build/products: [dev/README.md, dev/sales.md, prod/README.md, prod/sales.md]
