description: "plan shows each REPLACE_ME once under the environments that have it, as a warning, writes the files with the text as written and counts the places still to write; it exits 0."
files:
  project.yaml: |
    id: retail
    environments:
      dev:
        values: { account: REPLACE_ME }
      prod:
        values: { account: REPLACE_ME }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [fold@2]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: fold
    connectivity: public
    settings: { path: "/data/${values.account}" }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: REPLACE_ME, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
command: apply
expect:
  exit: 0
  lines:
    - "dev, prod: warnings"
    - "dev: warnings"
    - "prod: warnings"
    - "fold → build/fold (dev, prod)"
    - Applied.
    - "3 places are still REPLACE_ME; ingestron check fails until each is written."
  diagnostics:
    - { code: REPLACE_ME, severity: warning, file: sales.yaml, line: 6 }
    - { code: REPLACE_ME, severity: warning, file: project.yaml, line: 4 }
    - { code: REPLACE_ME, severity: warning, file: project.yaml, line: 6 }
  folders:
    build/fold: [tables.txt, targets.txt]
  texts:
    build/fold/tables.txt: "orders /data/REPLACE_ME\n"
