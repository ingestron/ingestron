description: "A moved mapping goes in whole into a databricks section the fix creates when the Platform has none."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    workspace: { host: h }
    tags: { a: b }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  platform:
    workspace: { host: h }
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 4
      fixes: [Move to databricks.workspace]
  fixed:
    - diagnostic: 0
      title: Move to databricks.workspace
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lakehouse
          tags: { a: b }
          databricks:
            workspace:
              host: h
