description: "Where the pack an environment runs on has no method that reads landed files, another pack's files ingest cannot run there."
environment: local
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, local: { runs-on: test } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, bridge@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: private
    settings: { server: db.example.invalid }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    ingest: { uses: bridge-copy, with: { landing: /land } }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }

expect:
  diagnostics:
    - { code: RUNS_ON, severity: error, file: sales.yaml, line: 4 }
