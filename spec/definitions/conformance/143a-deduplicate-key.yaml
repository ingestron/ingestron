description: "Deduplicate with no primary key in the contract is DEDUPLICATE_KEY, an error at deduplicate; an order_by column the contract does not list is CLEANSE_COLUMN at its item."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        cleanse:
          deduplicate: { order_by: [updated_at] }
      refunds:
        object: refunds
        contract: refunds
        cleanse:
          deduplicate: { order_by: [updated_at, changed_at] }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer }
          - { name: updated_at, logicalType: timestamp }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: updated_at, logicalType: timestamp }
expect:
  diagnostics:
    - code: DEDUPLICATE_KEY
      severity: error
      file: sales.yaml
      line: 10
      message: '"orders" has no primary key, so deduplicate cannot tell which rows belong together.'
      hint: 'Mark the key columns `primaryKey: true` in contract "orders".'
    - code: CLEANSE_COLUMN
      severity: error
      file: sales.yaml
      line: 15
      message: '"changed_at" is not a column of contract "refunds".'
      hint: "Use a column the contract lists: id, updated_at."
