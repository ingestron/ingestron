description: Alerts on slow runs need slow_after, the time after which a run is slow; without it the standard does not load.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      alerts: { on: [slow] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 6
      column: 11
      message: operations.alerts needs "slow_after".
      hint: |-
        How long a run may take before it is slow, such as 1h.
        For example:
          slow_after: 30d
