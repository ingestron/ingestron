description: Each value is judged by one step's pack, so with two packs the load mode is judged by the ingest step's pack and history by the store step's. A value the judging pack does not list reports nothing, even when another pack lists it.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, bridge@1]
    features: ga
    ingest:
      settings:
        bridge-copy: { landing: /landing }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: private
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    load: { mode: changes }
    tables:
      orders: { object: orders, contract: orders, history: full }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      ingest: { method: bridge-copy, pack: bridge }
      store: { method: stream, pack: test }
  previewFeatures: []
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 5
      message: "load.mode: changes isn't applied on bridge: Changes are not copied yet."
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 7
      message: "history: full isn't applied on test: History is not kept yet."
