description: "The same contract and Platform give each environment its own principal, through values."
environment: dev
files:
  project.yaml: |
    id: retail
    environments:
      dev: { values: { marketing_group: marketing-analysts-dev } }
      test: { values: { marketing_group: marketing-analysts-test } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    principals:
      marketing-analysts: ${values.marketing_group}
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
      stores: { object: stores, contract: stores }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }
    roles:
      - { role: marketing-analysts, access: read, description: Campaign reporting }
  stores.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: stores
    version: 1.0.0
    status: draft
    schema:
      - name: stores
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
expect:
  platform:
    principals: { marketing-analysts: marketing-analysts-dev }
  tables:
    - name: orders
      access:
        grants:
          - role: marketing-analysts
            principal: marketing-analysts-dev
            privileges: [read]
            from: contract
        exact: false
        masks: []
        filters: []
    - name: stores
      access: null
