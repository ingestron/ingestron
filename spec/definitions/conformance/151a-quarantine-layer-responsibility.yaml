description: "Quarantine written where the layer does not quarantine is LAYER_RESPONSIBILITY: on a flow table at the setting, on a layer at the layer's setting once however many tables it has. The standard's own quarantine reaches no such table and reports nothing."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [check, quarantine] }
      - name: gold
        does: [check]
        quality: { quarantine: true }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        quality: { quarantine: true }
        expectations:
          - { name: positive, check: total > 0, action: warn }
  a_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    layer: gold
    inputs: [orders]
    contract: orders
  b_best.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: best
    layer: gold
    inputs: [orders]
    contract: orders
  c_off.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: off
    layer: gold
    inputs: [orders]
    contract: orders
    quality: { quarantine: false }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: sales.yaml
      line: 9
      message: 'The layer "bronze" does not list quarantine in its does, so quarantine cannot be set here.'
      hint: "Layers that do quarantine: silver. Or add `quarantine` to this layer's `does`."
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: standard.yaml
      line: 10
      message: 'The layer "gold" does not list quarantine in its does, so quarantine cannot be set here.'
      hint: "Layers that do quarantine: silver. Or add `quarantine` to this layer's `does`."
