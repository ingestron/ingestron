description: "A model lists only the deploy-time values its own environment uses: a default that the environment's own value replaces is not listed."
environment: prod
deployTime: true
files:
  project.yaml: |
    id: retail
    values:
      host: "${envvar:DEV_HOST}"
    environments:
      dev: {}
      prod:
        values: { host: "${envvar:PROD_HOST}" }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: "${values.host}/shop" }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - name: orders
      ingest:
        connection: { settings: { path: "${envvar:PROD_HOST}/shop" } }
  deployValues:
    - name: PROD_HOST
      text: "${envvar:PROD_HOST}"
      uses: [{ file: project.yaml, pointer: /values/host, line: 7 }]
