description: "A cleansing operation that does not fit a column of the source metadata is CLEANSE_TYPE for a table with no contract, naming the metadata and its object, not a contract id."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        cleanse:
          columns:
            id: { trim: true }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true }
          - { name: updated_at, logicalType: timestamp, required: false }
expect:
  diagnostics:
    - code: CLEANSE_TYPE
      severity: error
      file: sales.yaml
      line: 10
      message: '"trim" works on text, and "id" is integer in "ERP.dbo.Orders" in the source metadata.'
