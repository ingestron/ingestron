description: "A transform without code and with more than one input is TRANSFORM_CODE, an error at its inputs."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - bronze
      - silver
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  a_daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders, orders2]
    contract: daily
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  other.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: orders2
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: orders2
  orders2.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders2
    version: 1.0.0
    status: draft
    schema:
      - name: orders2
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: TRANSFORM_CODE
      severity: error
      file: a_daily.yaml
      line: 4
      message: '"daily" has no code, which a transform may leave out only with one input; it has 2.'
      hint: Write the code, or give the transform one input.
