description: A store method must accept what ingest produces; a method that writes tables needs no store step.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    ingest:
      default: managed
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  more.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: more
    source: shop
    store:
      uses: stream
    tables:
      extra: { object: extra, contract: extra }
  extra.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: extra
    version: 1.0.0
    status: draft
    schema:
      - name: extra
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: HANDOVER
      file: more.yaml
      line: 6
      column: 9
