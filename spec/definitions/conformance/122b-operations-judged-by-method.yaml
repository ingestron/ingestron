description: "A pack's entry for an operations value is the entry of a method of the pack that the project's tables use, when it is used, before the pack's own: workspace@1 stands for Synapse, whose own entry says serverless views run no jobs, and whose ws-copy method, as the Synapse copy pipeline, runs a schedule for each flow, so the schedule is not reported."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [workspace@1]
    operations:
      schedule: { per: flow }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: workspace
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics: []
