description: "A table whose steps cannot be resolved is not judged for the access reason of CONTRACT_NEEDED, since the pack that keeps it is not known: the unknown store method is the error to fix, and the table, with no contract and no source metadata, has TABLE_NO_COLUMNS, not CONTRACT_NEEDED as in case 184a. This pins what is so, and nothing is reported for the skipped reason."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    layers:
      - { name: bronze, does: raw }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      manage: { masks: true, tags: true }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    store: { uses: no-such-method }
    tables:
      orders: { object: ERP.dbo.Orders }
expect:
  diagnostics:
    - { code: UNKNOWN_METHOD, severity: error, file: sales.yaml, line: 5 }
    - { code: TABLE_NO_COLUMNS, severity: error, file: sales.yaml, line: 7 }
