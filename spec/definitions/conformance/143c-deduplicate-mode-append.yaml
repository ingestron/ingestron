description: "Deduplicate on a table whose store appends (a method with a mode alias, whose mode setting is append) is DEDUPLICATE_MODE, an error at deduplicate: rows already kept cannot be deduplicated. A mode that stands for no intent value (snapshot) is not an append. Writing mode append is also SETTING_MOVED, as it always is."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        store:
          with: { mode: append }
        cleanse:
          deduplicate: { order_by: [updated_at] }
      returns:
        object: returns
        contract: orders
        store:
          with: { mode: snapshot }
        cleanse:
          deduplicate: { order_by: [updated_at] }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: updated_at, logicalType: timestamp }
expect:
  diagnostics:
    - code: SETTING_MOVED
      severity: warning
      file: sales.yaml
      line: 10
      message: '"mode" is now written as intent: history: none.'
    - code: DEDUPLICATE_MODE
      severity: error
      file: sales.yaml
      line: 12
      message: 'Deduplicate cannot work for "orders": its store appends rows, and rows already kept cannot be deduplicated.'
      hint: "Set history: latest to keep one row per key, or deduplicate in a transform that reads this table."
