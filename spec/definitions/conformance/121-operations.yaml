description: The standard's operations policy, with defaults filled, and its quality.results are in the model. A pack that declares operations used judges them, and the platform gives the tag the standard requires, so nothing is reported.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      retries: { count: 2, interval: 5m }
      concurrency: { max_runs: 1, queue: true }
      require_tags: [cost_centre]
    quality: { results: true }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: main
    tags: { cost_centre: "4100" }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  operations:
    schedule: { per: project }
    trigger: schedule
    retries: { count: 2, interval: 5m }
    alerts: { on: [failure] }
    concurrency: { max_runs: 1, queue: true }
    require_tags: [cost_centre]
  qualityResults: true
