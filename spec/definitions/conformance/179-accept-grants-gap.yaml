description: "A NOT_APPLIED for a role's grant has the feature grants, so an accept entry with about.feature grants accepts it (section 8.2 and Accepted warnings)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, local@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    accept:
      - code: NOT_APPLIED
        about: { feature: grants }
        reason: Local DuckDB with synthetic data; access is enforced in test and prod.
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: local-table }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
    roles:
      - { role: finance-analysts, access: read }
expect:
  diagnostics: []
  accepted:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 12
      message: 'Access for the role "finance-analysts" in table "orders" isn''t applied on local: It has no access control.'
      subject: { table: orders, feature: grants }
      reason: Local DuckDB with synthetic data; access is enforced in test and prod.
      entry: { file: platform.yaml, line: 5 }
