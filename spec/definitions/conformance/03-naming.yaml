description: Name patterns come from the pack, then the standard, then the platform, with the documented variables.
environment: test
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    naming:
      catalog: main
      schema: "{{ environment }}_{{ layer }}"
      table: "{{ source }}_{{ table }}"
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    naming:
      catalog: "{{ project }}_lake"
      pipeline: "{{ project }}_{{ environment }}"
expect:
  tables:
    - fullName: retail_lake.test_bronze.shop_orders
      name: orders
  names:
    pipeline: retail_test
    job: retail_refresh
