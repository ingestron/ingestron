description: A rule matches the load mode and history a table declares as intent; a table that does not declare them does not match, and a layer's history counts as declared.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - bronze
      - { name: silver, history: latest }
    store:
      when:
        - { history: latest, use: view }
        - { load: full, use: view }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders, history: latest }
      refunds: { object: refunds, contract: refunds }
      snapshots: { object: snapshots, contract: snapshots, load: { mode: full } }
      events: { object: events, contract: events, load: { mode: incremental } }
  cleaned.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: cleaned
    source: shop
    layer: silver
    tables:
      customers: { object: customers, contract: customers }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  snapshots.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: snapshots
    version: 1.0.0
    status: draft
    schema:
      - name: snapshots
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  events.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: events
    version: 1.0.0
    status: draft
    schema:
      - name: events
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: customers
      store:
        method: view
        chosenBy: { by: standard-rule, when: { history: latest }, file: standard.yaml, line: 10 }
    - name: orders
      store:
        method: view
        chosenBy: { by: standard-rule, when: { history: latest }, file: standard.yaml, line: 10 }
    - name: refunds
      store:
        method: stream
        chosenBy: { by: pack-default }
    - name: snapshots
      store:
        method: view
        chosenBy: { by: standard-rule, when: { load: full }, file: standard.yaml, line: 11 }
    - name: events
      store:
        method: stream
        chosenBy: { by: pack-default }
