description: "A role the Platform does not map is its own principal; write access gives read and write, and a role with no access reads."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
    roles:
      - { role: etl-writers, access: write }
      - { role: finance-analysts }
expect:
  platform:
    principals: {}
  tables:
    - name: orders
      access:
        grants:
          - { role: etl-writers, principal: etl-writers, privileges: [read, write], from: contract }
          - {
              role: finance-analysts,
              principal: finance-analysts,
              privileges: [read],
              from: contract,
            }
        exact: false
        masks: []
        filters: []
