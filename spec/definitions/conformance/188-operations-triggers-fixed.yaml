description: The triggers policy has defaults, the selected environment's entry replaces the common values key by key (hours any removes the hours), and fixed.operations.triggers wins over both. Here dev removes the hours and fixed leaves only schedule.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    operations:
      triggers:
        timezone: Europe/London
        hours: { from: "22:00", to: "06:00" }
        environments:
          dev: { hours: any }
          prod: { timezone: UTC }
    fixed:
      operations:
        triggers: { types: [schedule] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  operations:
    schedule: { per: project }
    trigger: schedule
    alerts: { on: [failure] }
    require_tags: []
    triggers:
      types: [schedule]
      timezone: Europe/London
