description: "{{ }} outside naming patterns and transform code stays as written: a warning, with the ${…} form as the fix."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    values:
      account: sa_{{env}}
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    naming:
      schema: "{{ layer }}_{{ project }}"
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: "/data/{{ environment }}/shop" }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    description: Sales for {{ table }}
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    description: { purpose: "Orders, {{ kept }} as the source writes them" }
    schema:
      - name: orders
        properties:
          - { name: id, logicalType: integer }
expect:
  diagnostics:
    - { code: PLACEHOLDER_NOT_REPLACED, severity: warning, file: project.yaml, line: 4 }
    - { code: PLACEHOLDER_NOT_REPLACED, severity: warning, file: sales.yaml, line: 5 }
    - { code: PLACEHOLDER_NOT_REPLACED, severity: warning, file: shop.yaml, line: 6 }
