description: A standard that allows only schedule triggers refuses a tumbling window (TRIGGER_NOT_ALLOWED, at the trigger's type). A trigger name used twice, and an option on the wrong type, are TRIGGER_OPTION; a tumbling window that sets windowStart is TRIGGER_PARAMETER. Each is an error at the value.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      schedule: { per: flow }
      triggers: { types: [schedule] }
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    ingest:
      triggers:
        - name: hourly
          type: tumbling-window
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
          parameters:
            windowStart: x
        - name: hourly
          type: schedule
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
          lookback: 2h
          delay: 5m
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: TRIGGER_NOT_ALLOWED
      severity: error
      file: shop.yaml
      line: 8
      message: "The standard allows only schedule triggers."
    - code: TRIGGER_OPTION
      severity: error
      file: shop.yaml
      line: 13
      message: 'The trigger name "hourly" is used twice in the flow "shop".'
    - code: TRIGGER_OPTION
      severity: error
      file: shop.yaml
      line: 18
      message: 'The trigger "hourly" is a schedule trigger, so it cannot have delay.'
    - code: TRIGGER_PARAMETER
      severity: error
      file: shop.yaml
      line: 12
      message: 'The trigger "hourly" sets the built-in parameter "windowStart", which only a schedule trigger can set.'
