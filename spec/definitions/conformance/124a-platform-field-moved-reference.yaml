description: "The fix of PLATFORM_FIELD_MOVED moves the value as written: a reference stays a reference, so no environment's value reaches the file."
environment: dev
files:
  project.yaml: |
    id: retail
    environments:
      dev: { values: { mode: development, team: dev-team@example.com } }
      prod: { values: { mode: production, team: ops-team@example.com } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    mode: ${values.mode}
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  platform:
    mode: development
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 4
      fixes: [Move to databricks.mode]
  fixed:
    - diagnostic: 0
      title: Move to databricks.mode
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lakehouse
          databricks:
            mode: ${values.mode}
