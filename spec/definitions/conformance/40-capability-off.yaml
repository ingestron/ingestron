description: A contract field that needs a capability the platform has not turned on is a warning with a fix that turns it on; so are grants without managed schemas.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    grants:
      bronze: [{ principal: analysts, privileges: [SELECT] }]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, logicalType: string, tags: [pii] }
expect:
  diagnostics:
    - {
        code: CAPABILITY_OFF,
        severity: warning,
        file: platform.yaml,
        line: 5,
        fixes: [Turn on manage.schemas],
      }
    - {
        code: CAPABILITY_OFF,
        severity: warning,
        file: orders.odcs.yaml,
        line: 11,
        fixes: [Turn on manage.tags],
      }
  fixed:
    - diagnostic: 1
      title: Turn on manage.tags
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lake
          grants:
            bronze: [{ principal: analysts, privileges: [SELECT] }]
          manage:
            tags: true
