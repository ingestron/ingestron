description: "Row filters match columns by their tags, so manage.filters on with manage.tags off is CAPABILITY_OFF at manage.filters, with the capability tags and its fix, as for masks (section 7.1). The filters are still resolved and applied."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    governance:
      filters:
        region_rows: { function: main.governance.region_filter, match: { classification: restricted } }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      run_as: { service_principal_name: etl-runner }
      manage: { filters: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: country, logicalType: string, classification: restricted }
expect:
  tables:
    - name: orders
      access:
        filters: [{ name: region_rows, column: country, function: main.governance.region_filter }]
  diagnostics:
    - code: CAPABILITY_OFF
      severity: warning
      file: platform.yaml
      line: 6
      message: "Row filters are not applied: the platform has Tags off."
      hint: "Turn it on with databricks.manage.tags in platform.yaml. It needs: APPLY TAG on the tables."
      fixes: [Turn on manage.tags]
      subject: { feature: tags }
  fixed:
    - diagnostic: 0
      title: Turn on manage.tags
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lake
          databricks:
            run_as: { service_principal_name: etl-runner }
            manage: { filters: true, tags: true }
