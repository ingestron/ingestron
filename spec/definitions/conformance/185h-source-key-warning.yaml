description: "With sources.breaking warn, a different primary key is a warning whose feature is (primary key), so a column named key is never mistaken for it, and the platform accepts it by that feature and not the column's own warning."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    sources: { breaking: warn }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    accept:
      - code: SOURCE_KEY_CHANGED
        about: { feature: (primary key) }
        reason: The ERP adds region to the key in the next release.
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: key, logicalType: integer }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: region, logicalType: string, required: true, primaryKeyPosition: 2 }
          - { name: key, logicalType: string, required: false }
expect:
  diagnostics:
    - code: SOURCE_TYPE_CHANGED
      severity: warning
      file: sales.yaml
      line: 8
      subject: { table: orders, feature: key }
    - code: SOURCE_COLUMN_NEW
      severity: information
      file: sales.yaml
      line: 8
      subject: { table: orders, feature: region }
  accepted:
    - code: SOURCE_KEY_CHANGED
      severity: warning
      file: sales.yaml
      line: 8
      subject: { table: orders, feature: (primary key) }
