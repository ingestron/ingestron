description: A flow table that writes a setting value the alias does not list, and intent at the same place that would make it another value, keeps the setting; the intent is NOT_APPLIED. A table that writes no such value is written from intent as before.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders, history: latest, store: { with: { mode: snapshot } } }
      refunds: { object: refunds, contract: refunds, history: latest }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      intent: { history: latest }
      store:
        method: stream
        settings: { mode: snapshot }
        origins:
          mode: { layer: table, file: sales.yaml, line: 6 }
    - name: refunds
      intent: { history: latest }
      store:
        method: stream
        settings: { mode: upsert }
        origins:
          mode: { layer: table, file: sales.yaml, line: 7 }
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 6
      message: 'history: latest isn''t applied on test: the setting "mode: snapshot" in sales.yaml decides it.'
