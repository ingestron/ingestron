description: "A flow table whose object holds an unset reference is listed with its object as written, `${envvar:…}` included, and with the entry its other parts match: a part that is only a reference matches anything."
environment: dev
sourceTables: true
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      one: { object: "${envvar:TABLE}", contract: orders }
      wild: { object: "${envvar:SCHEMA}.Customers" }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 7 }
  sourceTables:
    - flow: sales
      table: one
      connection: erp
      object: "${envvar:TABLE}"
      contract: orders
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: wild
      connection: erp
      object: "${envvar:SCHEMA}.Customers"
      entry:
        object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
