description: "The fix for notifications.on_failure keeps the addresses as written, references included."
environment: dev
files:
  project.yaml: |
    id: retail
    environments:
      dev: { values: { mode: development, team: dev-team@example.com } }
      prod: { values: { mode: production, team: ops-team@example.com } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    notifications: { on_failure: ['${values.team}'] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  platform:
    alerts:
      - { kind: email, to: [dev-team@example.com], on: [failure] }
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 4
      fixes: [Move to alerts]
  fixed:
    - diagnostic: 0
      title: Move to alerts
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lakehouse
          alerts:
            - kind: email
              to:
                - ${values.team}
              on:
                - failure
