description: A contract field the pack that keeps the table does not use yet is NOT_APPLIED at that field, with the pack's reason, about the table and the field's path, and the project still resolves.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: country, logicalType: string, encryptedName: ctry_enc, description: Two letters. }
expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 11
      message: 'encryptedName of "country" in contract "orders" isn''t applied on test: Columns are not decrypted yet.'
      subject: { table: orders, feature: schema.*.properties.*.encryptedName }
