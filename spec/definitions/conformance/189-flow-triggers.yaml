description: A flow writes its own triggers and parameters under ingest, when the standard keeps a schedule for each flow. Every table of the flow holds them in order, each with the flow's id, and a trigger with no time zone of its own takes the standard's, here Europe/London. Its weekly full reload is kept by key (history latest), so it passes the key check.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      schedule: { per: flow }
      triggers: { timezone: Europe/London }
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    history: latest
    ingest:
      parameters:
        min_date: { type: date, default: "2020-01-01" }
      triggers:
        - name: hourly
          type: tumbling-window
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
          delay: 5m
          concurrency: 1
          retries: { count: 3, interval: 300s }
          depends_on:
            - { self: true, offset: -1h }
        - name: weekly-reload
          type: schedule
          every: { frequency: Week, interval: 1 }
          start: 2026-12-01T00:00:00Z
          at: { weekdays: [Sunday], hours: [2], minutes: [0] }
          parameters:
            load: full
            min_date: { expression: "@formatDateTime(addDays(trigger().scheduledTime, -30), 'yyyy-MM-dd')" }
    tables:
      orders: { object: orders, contract: orders }
      customers: { object: customers, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      ingest:
        parameters: { min_date: { type: date, default: "2020-01-01" } }
        triggers:
          - flow: shop
            name: hourly
            type: tumbling-window
            every: { frequency: Hour, interval: 1 }
            start: "2026-12-01T00:00:00Z"
            timezone: Europe/London
            delay: 5m
            concurrency: 1
            retries: { count: 3, interval: 300s }
            depends_on: [{ self: true, offset: -1h }]
            parameters: {}
          - flow: shop
            name: weekly-reload
            type: schedule
            every: { frequency: Week, interval: 1 }
            start: "2026-12-01T00:00:00Z"
            at: { weekdays: [Sunday], hours: [2], minutes: [0] }
            timezone: Europe/London
            parameters:
              load: full
              min_date:
                {
                  expression: "@formatDateTime(addDays(trigger().scheduledTime, -30), 'yyyy-MM-dd')",
                }
    - name: customers
      ingest:
        parameters: { min_date: { type: date, default: "2020-01-01" } }
        triggers:
          - { flow: shop, name: hourly, timezone: Europe/London }
          - { flow: shop, name: weekly-reload, timezone: Europe/London }
