description: "On a pack that grants read access only, write access is NOT_APPLIED at the role's access, for the contract's roles and the layer's, and the read grant is applied. Exact grants the pack does not apply are NOT_APPLIED at the standard's access.grants (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, views@1]
    layers:
      - name: bronze
        access: { roles: [{ role: loaders, access: write }] }
      - silver
      - gold
    governance:
      access: { grants: exact }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    views:
      manage: { grants: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: file-view }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
    roles:
      - { role: finance-analysts, access: read }
      - { role: etl-writers, access: write }
expect:
  tables:
    - name: orders
      notApplied:
        - { feature: write, reason: Views are read-only. }
        - { feature: exact, reason: Exact grants are not applied to views yet. }
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 13
      message: 'Write access for the role "etl-writers" in table "orders" isn''t applied on views: Views are read-only.'
      subject: { table: orders, feature: write }
    - code: NOT_APPLIED
      severity: warning
      file: standard.yaml
      line: 7
      message: 'Write access for the role "loaders" in table "orders" isn''t applied on views: Views are read-only.'
      subject: { table: orders, feature: write }
    - code: NOT_APPLIED
      severity: warning
      file: standard.yaml
      line: 11
      message: 'The exact grant mode in table "orders" isn''t applied on views: Exact grants are not applied to views yet.'
      subject: { table: orders, feature: exact }
