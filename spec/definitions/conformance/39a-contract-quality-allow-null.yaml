description: A missing-values list that allows null, and one that names only null, as rules.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { default: drop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - name: unit
            logicalType: string
            quality:
              - { name: unit_known, metric: missingValues, arguments: { missingValues: ["", N/A] }, mustBe: 0 }
              - { name: unit_set, metric: missingValues, arguments: { missingValues: [null] }, mustBe: 0 }
expect:
  tables:
    - expectations:
        - { name: id_not_null, check: "`id` IS NOT NULL", rule: { kind: notNull, column: id } }
        - {
            name: unit_known,
            check: "`unit` IS NULL OR `unit` NOT IN ('', 'N/A')",
            rule: { kind: notIn, column: unit, values: ["", N/A], allowNull: true },
          }
        - { name: unit_set, check: "`unit` IS NOT NULL", rule: { kind: notNull, column: unit } }
