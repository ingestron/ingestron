description: Platform settings pass through after defaults; schedules are paused outside production.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    workspace: { host: https://example.cloud.databricks.com }
    run_as: { service_principal_name: 1d5c-sp }
    compute: { budget_policy_id: bp-1 }
    tags: { team: sales }
    permissions:
      - { group_name: analysts, level: CAN_VIEW }
    schedule: { cron: '0 0 6 * * ?', timezone: Pacific/Auckland }
    notifications: { on_failure: [data@example.com] }
    manage: { schemas: true }
    grants:
      bronze: [{ principal: engineers, privileges: [USE_SCHEMA, SELECT] }]
expect:
  platform:
    mode: development
    workspace:
      host: https://example.cloud.databricks.com
    run_as:
      service_principal_name: 1d5c-sp
    compute:
      serverless: true
      budget_policy_id: bp-1
    tags:
      team: sales
    permissions:
      - group_name: analysts
        level: CAN_VIEW
    schedule:
      cron: 0 0 6 * * ?
      timezone: Pacific/Auckland
      paused: true
    notifications:
      on_failure:
        - data@example.com
    manage:
      schemas: true
    grants:
      bronze:
        - principal: engineers
          privileges:
            - USE_SCHEMA
            - SELECT
