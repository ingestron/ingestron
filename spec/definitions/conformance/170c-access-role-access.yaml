description: "A role's access other than read or write is ROLE_ACCESS, an error at the value, where the role would be granted: on tables kept by a pack that applies grants, with grants on (section 8.2). It is reported once although two tables use the contract."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      manage: { grants: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      orders: { object: orders, contract: orders }
      returns: { object: returns, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
    roles:
      - { role: finance-analysts, access: read }
      - { role: etl-writers, access: readwrite }
expect:
  diagnostics:
    - code: ROLE_ACCESS
      severity: error
      file: orders.odcs.yaml
      line: 13
      message: 'The role "etl-writers" of contract "orders" has access "readwrite"; it must be read or write.'
      hint: "Write read, or write for read and write. Leave it out to read."
