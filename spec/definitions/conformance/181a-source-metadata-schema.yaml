description: "A table captured from a rung that is not one of the five is refused by the schema, at the value."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  sources/shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: shop
    connection: shop
    tables:
      - object: orders
        captured: { at: 2026-11-12T09:30:00Z, from: guess, file: orders.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: total, sourceType: "decimal(18,2)", logicalType: number, required: false }
expect:
  diagnostics:
    - code: SCHEMA
      severity: error
      file: sources/shop.yaml
      line: 7
      column: 49
      message: 'tables[0].captured.from is "guess"; use one of: catalog, document, sample, columns, assistant.'
