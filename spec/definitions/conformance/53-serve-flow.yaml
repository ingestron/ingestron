description: "A flow can serve its tables after their last step."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    serve: { uses: publish }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }

expect:
  tables:
    - name: orders
      store: { method: stream }
      serve: { method: publish, chosenBy: { by: definition, file: sales.yaml, line: 5 } }
