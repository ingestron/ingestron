description: A flow table's source row `filter` is held as written, with its `{{ parameters.<name> }}` references unexpanded, on a method that filters (`copy`) when each reference names a parameter the flow declares. A table that writes none has no filter. {{ }} in a filter is not a PLACEHOLDER_NOT_REPLACED warning.The model holds the filter as written, with its references unexpanded.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    ingest:
      uses: copy
      with: { landing: /landing }
      parameters:
        min_date: { type: date, default: "2020-01-01" }
        region: { type: string, default: eu }
    tables:
      orders:
        object: orders
        contract: orders
        ingest:
          filter: "OrderDate >= {{ parameters.min_date }} AND Region = {{parameters.region}} AND Loaded <= {{ parameters.windowEnd }} AND {{parameters.load}} = 'full'"
      customers:
        object: customers
        contract: orders
        ingest:
          filter: "CreatedOn >= {{ parameters.min_date }}"
      suppliers: { object: suppliers, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      ingest:
        filter: "OrderDate >= {{ parameters.min_date }} AND Region = {{parameters.region}} AND Loaded <= {{ parameters.windowEnd }} AND {{parameters.load}} = 'full'"
    - name: customers
      ingest:
        filter: "CreatedOn >= {{ parameters.min_date }}"
    - name: suppliers
      ingest:
        filter: null
  diagnostics: []
