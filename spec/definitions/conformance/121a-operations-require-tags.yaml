description: A tag the standard requires and the platform does not give is BAD_SETTING, an error at the platform's tags.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      retries: { count: 2, interval: 5m }
      concurrency: { max_runs: 1, queue: true }
      require_tags: [cost_centre]
    quality: { results: true }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: main
    tags: { owner: data }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: BAD_SETTING
      severity: error
      file: platform.yaml
      line: 4
      message: 'The standard requires the tag "cost_centre" on every platform.'
