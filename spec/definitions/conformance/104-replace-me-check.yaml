description: With replaceMe error, as ingestron check resolves, REPLACE_ME is an error, also when resolving for deploy, and a top-level project.yaml value is reported where it was written.
environment: dev
replaceMe: error
deployTime: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, prod: { values: { folder: shop } } }
    values:
      folder: REPLACE_ME
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: "/data/${values.folder}" }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        properties:
          - { name: id, logicalType: integer }
expect:
  diagnostics:
    - code: REPLACE_ME
      severity: error
      file: project.yaml
      line: 4
      message: "values.folder is still REPLACE_ME: write the real value before deploying."
