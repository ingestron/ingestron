description: "The model's notApplied lists, for each table, the features NOT_APPLIED reports about it, recorded before a warning about several tables loses its table: two tables kept by a method that does not count failing rows have the warn action in notApplied, and a third table of the same contract, kept by another method of the same pack, has none."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [quality@1]
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  uncounted.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: uncounted
    source: source
    store: { uses: quality-uncounted }
    tables:
      orders: { object: orders, contract: orders }
      returns: { object: returns, contract: orders }
  counted.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: counted
    source: source
    tables:
      refunds: { object: refunds, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: refunds
      notApplied: null
    - name: orders
      notApplied: [{ feature: warn, reason: A failing row is not counted yet. }]
    - name: returns
      notApplied: [{ feature: warn, reason: A failing row is not counted yet. }]
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 10
      message: "The warn action isn't applied on quality: A failing row is not counted yet."
      subject: { feature: warn }
