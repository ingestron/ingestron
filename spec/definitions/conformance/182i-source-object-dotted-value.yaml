description: "A value that a reference puts in a part of the flow's object is not split again. With values.dotted as EU.1, the part dbo.Orders_${values.dotted} mixes text and the reference, so it matches nothing, not the table written dbo.Orders_EU.1; the part ${values.dotted}.Customers has the reference alone as its leftmost part, so it matches anything there; and dbo.${values.dotted} has it alone as its last part, so it matches any table in a dbo schema, here ERP.dbo.Customers, not dbo.Orders_EU.1."
environment: dev
sourceTables: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    values: { dotted: "EU.1" }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      mixed: { object: "dbo.Orders_${values.dotted}" }
      leftmost: { object: "${values.dotted}.Customers" }
      last: { object: "dbo.${values.dotted}" }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      - object: dbo.Orders_EU.1
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - { code: TABLE_NO_COLUMNS, severity: error, file: sales.yaml, line: 6 }
  sourceTables:
    - flow: sales
      table: mixed
      connection: erp
      object: dbo.Orders_EU.1
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: leftmost
      connection: erp
      object: EU.1.Customers
      entry:
        object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: last
      connection: erp
      object: dbo.EU.1
      entry:
        object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
