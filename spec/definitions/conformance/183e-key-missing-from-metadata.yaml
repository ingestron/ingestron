description: "A table that deduplicates, with no contract and no primaryKeyPosition in its metadata, is DEDUPLICATE_KEY, and its hint names the source metadata of its object, not a contract id."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: silver, does: [deduplicate] }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        cleanse:
          deduplicate: { order_by: [updated_at] }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true }
          - { name: updated_at, logicalType: timestamp, required: false }
expect:
  diagnostics:
    - code: DEDUPLICATE_KEY
      severity: error
      file: sales.yaml
      line: 9
      message: '"orders" has no primary key, so deduplicate cannot tell which rows belong together.'
      hint: 'Give the key columns a `primaryKeyPosition` in the source metadata of "ERP.dbo.Orders", or name a contract that marks them.'
