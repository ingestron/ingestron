description: Required columns and named expectations get the standard's actions unless they name one.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { required: fail, default: drop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive_total, check: total >= 0 }
          - { name: known_id, check: id < 1000000, action: warn }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - expectations:
        - name: id_not_null
          check: "`id` IS NOT NULL"
          action: fail
          from: contract
        - name: positive_total
          check: total >= 0
          action: drop
          from: definition
        - name: known_id
          check: id < 1000000
          action: warn
          from: definition
