description: A flow with nothing but a source and a contract gets every value from the pack's defaults.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - name: orders
      layer: bronze
      fullName: dev.bronze.orders
      origin:
        kind: Flow
        id: sales
        file: sales.yaml
      ingest:
        method: files
        settings:
          format: parquet
        object: orders
        connection:
          id: shop
          connector: files
          connectivity: public
          settings:
            path: /data/shop
      store:
        method: stream
        settings:
          cluster: auto
          properties:
            quality: raw
      contract:
        id: orders
        description: One row per order.
        primaryKey:
          - id
        columns:
          - name: id
            type: BIGINT
            logicalType: integer
            nullable: false
          - name: total
            type: DECIMAL(18,2)
            logicalType: number
            nullable: true
      expectations:
        - name: id_not_null
          check: "`id` IS NOT NULL"
          action: warn
          from: contract
  names:
    pipeline: retail
    job: retail_refresh
  platform:
    mode: development
    compute:
      serverless: true
    manage:
      schemas: false
    tags: {}
    permissions: []
    notifications:
      on_failure: []
    grants: {}
