description: Without a list of classification values there is no order, so a rule on classification never matches; a contract without a product has no product or domain fact.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    store:
      when:
        - { classification: restricted, use: view }
        - { product: sales, use: view }
        - { domain: retail, use: view }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      accounts: { object: accounts, contract: accounts }
  accounts.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: accounts
    version: 1.0.0
    status: draft
    schema:
      - name: accounts
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: balance, logicalType: number, classification: restricted }
expect:
  tables:
    - name: accounts
      store:
        method: stream
        chosenBy: { by: pack-default }
