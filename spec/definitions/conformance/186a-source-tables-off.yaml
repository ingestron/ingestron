description: "Without the option sourceTables, the result has no sourceTables, whatever the project holds: the project of case 186 resolves to the same model."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  crm.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: crm
    connector: files
    connectivity: public
    settings: { path: /data/crm }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: ERP.dbo.Orders, contract: orders }
      customers: { object: dbo.Customers }
  accounts.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: accounts
    source: crm
    tables:
      accounts: { object: Accounts, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      - object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, sourceType: int, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: name, sourceType: nvarchar(100), logicalType: string, required: false }
expect:
  diagnostics: []
  tables:
    - { name: accounts, contract: { id: orders, primaryKey: [id] } }
    - { name: orders, contract: { id: orders, primaryKey: [id] } }
    - {
        name: customers,
        contract: { id: "erp:ERP.dbo.Customers", origin: metadata, primaryKey: [id] },
      }
  sourceTables: null
