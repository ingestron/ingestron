description: Under prod the standard lets runs start only from 22:00 to 06:00, London time. An hourly trigger from midnight UTC starts its run at 06:00 in December, the first start outside those hours, so it is TRIGGER_HOURS, an error at the trigger, reported once although two tables share the flow.
environment: prod
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      schedule: { per: flow }
      triggers:
        timezone: Europe/London
        hours: { from: "22:00", to: "06:00" }
        environments:
          dev: { hours: any }
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    ingest:
      triggers:
        - name: hourly
          type: schedule
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
    tables:
      orders: { object: orders, contract: orders }
      customers: { object: customers, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: TRIGGER_HOURS
      severity: error
      file: shop.yaml
      line: 7
      message: '"hourly" starts a run at 06:00 (Europe/London), outside the hours the standard allows here: 22:00–06:00.'
