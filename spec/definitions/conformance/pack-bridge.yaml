# A second data-only pack, for cases where a standard uses two packs.
id: bridge
version: 1
defaults:
  naming: { catalog: unused, schema: unused, table: unused, pipeline: unused, job: unused }
  layers: [unused]
  types: {}
  quality: { required: fail, default: fail }
rules:
  ingest:
    when:
      - { connectivity: private, use: bridge-copy }
methods:
  bridge-copy:
    action: ingest
    description: Copies from a source the platform cannot reach into a landing folder.
    connectors: [sqlserver]
    connectivity: [private]
    produces: files
    settings:
      type: object
      additionalProperties: false
      required: [landing]
      properties: { landing: { type: string } }
# What it does with intent paths and values (section 11.5).
intent:
  load.mode=full: { use: used, does: Copies the whole object each run. }
  load.mode=changes: { use: not-yet, reason: Changes are not copied yet. }
  audit=loaded_at: { use: not-yet, reason: Landed files carry no load time yet. }
# Its section of the Platform (section 7.2).
platformSection:
  type: object
  additionalProperties: false
  properties: { warehouse_id: { type: string } }
