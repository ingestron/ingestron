description: "A drop or fail action written in a layer whose does lacks check is LAYER_RESPONSIBILITY, an error at the action, and the hint names the layers that do check. A warn is allowed, and so is drop where the layer checks."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse] }
      - { name: gold, does: [check] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive, check: total > 0, action: drop }
          - { name: small, check: total < 100, action: warn }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  a_daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: daily
    expectations:
      - { name: big, check: total < 1000, action: fail }
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  b_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    inputs: [daily]
    code: "SELECT * FROM {{ tables.daily }}"
    contract: top
    layer: gold
    expectations:
      - { name: big, check: total < 1000, action: drop }
  top.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: top
    version: 1.0.0
    status: draft
    schema:
      - name: top
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: sales.yaml
      line: 10
      message: 'The layer "bronze" does not list check in its does, so a "drop" action cannot be set here.'
      hint: "Layers that do check: gold. Or add `check` to this layer's `does`."
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: a_daily.yaml
      line: 8
      message: 'The layer "silver" does not list check in its does, so a "fail" action cannot be set here.'
      hint: "Layers that do check: gold. Or add `check` to this layer's `does`."
