description: "A filter that matches two or more columns of a table is FILTER_MATCH, an error at the filter naming the columns, once for the contract although two tables use it."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    governance:
      filters:
        region_rows: { function: region_filter, match: { tag: region } }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    manage: { tags: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
      returns: { object: returns, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: country, logicalType: string, tags: [region] }
          - { name: ship_to, logicalType: string, tags: ["region:emea"] }
expect:
  diagnostics:
    - code: FILTER_MATCH
      severity: error
      file: standard.yaml
      line: 7
      message: 'The filter "region_rows" matches 2 columns of contract "orders": country, ship_to. A filter matches one column of each table.'
      hint: "Narrow its match, such as with a tag value, or tag only one of the columns."
