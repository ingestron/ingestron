description: A standard that names version 1 of a pack that is now version 2 and builds environments together gets PACK_VERSION, with a fix that names version 2.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, fold@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: PACK_VERSION
      severity: error
      file: standard.yaml
      line: 4
      column: 17
      message: This standard is for "fold@1", but the pack is fold@2, which builds every environment into one output folder.
      fixes: [Change to "fold@2"]
  fixed:
    - diagnostic: 0
      title: Change to "fold@2"
      files:
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1, fold@2]
