description: "A flow table whose object is one reference that is unset at planning has no known name, so it is not SOURCE_TABLE_GONE although the document holds catalog tables and the object matches none: only the unset variable is reported."
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: "${envvar:TABLE}"
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Invoices
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 7 }
