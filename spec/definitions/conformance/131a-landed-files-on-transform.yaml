description: Only the audit values that need a step reading the source are NOT_APPLIED on a transform's table. A retention.landed_files written for the project, which the ingest step judges, gives the transform's table no diagnostic.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    retention: { landed_files: 90d }
    layers: [bronze, silver]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    layer: bronze
    tables:
      orders: { object: orders, contract: orders }
  daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: daily
    layer: silver
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
    - name: daily
      intent: { retention: { landed_files: 90d } }
  diagnostics: []
