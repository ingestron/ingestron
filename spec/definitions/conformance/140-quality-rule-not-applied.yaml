description: A rule kind the pack that keeps the table does not apply is NOT_APPLIED at the rule, with the pack's reason, about the table and the kind; the kinds it does not list report nothing.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [quality@1]
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: source
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - name: code
            logicalType: string
            logicalTypeOptions: { maxLength: 8 }
            quality:
              - { metric: invalidValues, arguments: { pattern: "^[A-Z]+$" }, mustBe: 0 }
expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 15
      message: "The pattern rule isn't applied on quality: Its engine has no regular expressions."
      subject: { table: orders, feature: pattern }
