description: A named method must be allowed, exist, be for its action and read the connector.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    store:
      allowed: [stream]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    ingest:
      uses: managed
    store:
      uses: view
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  more.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: more
    source: shop
    ingest:
      uses: sql
    store:
      uses: nothing
    tables:
      extra: { object: extra, contract: extra }
  extra.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: extra
    version: 1.0.0
    status: draft
    schema:
      - name: extra
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: WRONG_ACTION
      file: more.yaml
      line: 6
      column: 9
    - code: UNKNOWN_METHOD
      file: more.yaml
      line: 8
      column: 9
    - code: CONNECTOR_NOT_SUPPORTED
      file: sales.yaml
      line: 6
      column: 9
    - code: METHOD_NOT_ALLOWED
      file: sales.yaml
      line: 8
      column: 9
