description: A key of operations.triggers.environments, or of the same under fixed, that is not an environment project.yaml declares would never apply, so it is TRIGGER_ENVIRONMENT, a warning at the key's entry that lists the environments. An entry for a declared environment is kept.
environment: prod
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    operations:
      triggers:
        timezone: Europe/London
        environments:
          production: { hours: any }
          prod: { timezone: UTC }
    fixed:
      operations:
        triggers:
          environments:
            staging: { timezone: UTC }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: TRIGGER_ENVIRONMENT
      severity: warning
      file: standard.yaml
      line: 9
      message: '"production" names no environment of this project; environments: dev, test, prod.'
    - code: TRIGGER_ENVIRONMENT
      severity: warning
      file: standard.yaml
      line: 15
      message: '"staging" names no environment of this project; environments: dev, test, prod.'
  operations:
    schedule: { per: project }
    trigger: schedule
    alerts: { on: [failure] }
    require_tags: []
    triggers: { types: [schedule, tumbling-window], timezone: UTC }
