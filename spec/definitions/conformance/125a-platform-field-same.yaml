description: The same value in both places is only PLATFORM_FIELD_MOVED; the fix removes the old key.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    mode: production
    databricks: { mode: production }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  platform:
    mode: production
    sections:
      databricks: { mode: production }
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 4
      fixes: [Move to databricks.mode]
