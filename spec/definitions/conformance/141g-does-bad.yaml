description: "A layer's does is raw or a list of the four duties; anything else is refused at the value."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: [clean] }
      - { name: silver, does: [] }
      - { name: gold, does: [raw] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 6
      column: 5
      message: layers[0] does not match any of the forms allowed here.
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 6
      column: 27
      message: layers[0].does does not match any of the forms allowed here.
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 7
      column: 5
      message: layers[1] does not match any of the forms allowed here.
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 7
      column: 27
      message: layers[1].does does not match any of the forms allowed here.
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 8
      column: 5
      message: layers[2] does not match any of the forms allowed here.
    - code: SCHEMA
      severity: error
      file: standard.yaml
      line: 8
      column: 25
      message: layers[2].does does not match any of the forms allowed here.
