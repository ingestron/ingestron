description: "A table that needs a contract for several reasons, with no contract and no source metadata, has only CONTRACT_NEEDED, with the first reason in the specification's order: the layer's duty before managed access and its own expectations, and cleanse before check."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    layers:
      - { name: silver, does: [check, quarantine, cleanse] }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      manage: { masks: true, grants: true, tags: true }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    store: { uses: uc-table }
    tables:
      orders:
        object: ERP.dbo.Orders
        expectations:
          - { name: positive, check: total > 0, action: warn }
expect:
  diagnostics:
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 8
      message: '"orders" needs a contract: its layer silver does cleanse.'
