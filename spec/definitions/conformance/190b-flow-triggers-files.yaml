description: A standard whose operations.trigger is not schedule refuses a flow's schedule and tumbling-window triggers, though it allows a schedule for each flow. TRIGGER_NOT_ALLOWED is an error at the flow's triggers.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      schedule: { per: flow }
      trigger: files
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    ingest:
      triggers:
        - name: hourly
          type: schedule
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: TRIGGER_NOT_ALLOWED
      severity: error
      file: shop.yaml
      line: 7
      message: "The standard's `operations.trigger` is files, so flows cannot write schedule or tumbling-window triggers."
