description: A trigger's start or end not written as an ISO 8601 date-time, YYYY-MM-DDTHH:mm with optional seconds and an optional Z or offset, is a schema error at the value, such as a space in place of the T.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    operations:
      schedule: { per: flow }
  webshop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: webshop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: shop
    source: webshop
    ingest:
      triggers:
        - name: nightly
          type: schedule
          every: { frequency: Day, interval: 1 }
          start: "2026-12-01 02:30"
          parameters: { load: full }
    tables:
      orders: { object: orders, contract: orders, history: latest }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: SCHEMA
      severity: error
      file: shop.yaml
      line: 10
