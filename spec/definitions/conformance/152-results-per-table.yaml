description: "Each table has its own quality results: the standard's, then its layer's, then its own, and the origin of each. The model's qualityResults stays the standard's."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { results: true }
    layers:
      - bronze
      - name: silver
        quality: { results: false }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
  a_clean.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: clean
    inputs: [orders]
    contract: orders
  b_back.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: back
    inputs: [orders]
    contract: orders
    quality: { results: true }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  qualityResults: true
  tables:
    - name: orders
      quality: { results: true }
      qualityOrigins:
        results: { layer: standard, file: standard.yaml, line: 5 }
    - name: clean
      quality: { results: false }
      qualityOrigins:
        results: { layer: layer, file: standard.yaml, line: 9 }
    - name: back
      quality: { results: true }
      qualityOrigins:
        results: { layer: definition, file: b_back.yaml, line: 6 }
  diagnostics: []
