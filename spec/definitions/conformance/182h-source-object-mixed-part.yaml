description: "A part of the flow's object that mixes text and a reference is compared after the reference is replaced, with case ignored when names says so: dbo.Orders_${values.region} is dbo.Orders_EU and matches ERP.dbo.Orders_eu alone, and dbo.Orders_${values.other} matches nothing."
environment: dev
sourceTables: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    values: { region: EU, other: XX }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: "dbo.Orders_${values.region}" }
      others: { object: "dbo.Orders_${values.other}" }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders_eu
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      - object: ERP.dbo.Orders_us
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - { code: TABLE_NO_COLUMNS, severity: error, file: sales.yaml, line: 7 }
  sourceTables:
    - flow: sales
      table: orders
      connection: erp
      object: dbo.Orders_EU
      entry:
        object: ERP.dbo.Orders_eu
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: others
      connection: erp
      object: dbo.Orders_XX
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
