description: "Whether a table with no contract needs one depends on the environment being planned: its flow's layer comes from a value that differs per environment, and in dev the layer does cleanse, so the table needs a contract. The same files in test (case 184i) put it in a raw layer, where it takes its columns from the source metadata."
environment: dev
files:
  project.yaml: |
    id: retail
    environments:
      dev: { values: { layer: silver } }
      test: { values: { layer: bronze } }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse] }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    layer: ${values.layer}
    tables:
      orders: { object: ERP.dbo.Orders }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true }
expect:
  diagnostics:
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 7
      message: '"orders" needs a contract: its layer silver does cleanse.'
