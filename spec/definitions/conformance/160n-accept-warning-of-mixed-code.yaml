description: "DEDUPLICATE_MODE is a warning for one table and an error for another: the entry accepts only the warning, and the error stays. With an error in the project, no entry is judged unused."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [dedupe@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    accept:
      - code: DEDUPLICATE_MODE
        reason: The on-call team checks this rule from CI.
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: dedupe
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: source
    tables:
      orders:
        object: orders
        contract: orders
        history: latest
        cleanse:
          deduplicate: { order_by: [updated_at] }
      returns:
        object: returns
        contract: orders
        store:
          with: { mode: append }
        cleanse:
          deduplicate: { order_by: [updated_at] }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: updated_at, logicalType: timestamp }
expect:
  diagnostics:
    - code: DEDUPLICATE_MODE
      severity: error
      file: sales.yaml
      line: 18
      subject: null
  accepted:
    - code: DEDUPLICATE_MODE
      severity: warning
      file: sales.yaml
      line: 11
      subject: { table: orders, feature: deduplicate }
      reason: The on-call team checks this rule from CI.
      entry: { file: platform.yaml, line: 5 }
