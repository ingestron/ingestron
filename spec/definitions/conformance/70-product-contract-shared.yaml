description: "A contract is the output of at most one product."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }
  finance-product.yaml: |
    apiVersion: v1.1.0
    kind: DataProduct
    id: finance
    name: Finance
    status: active
    description:
      purpose: Orders for reporting.
    team:
      members:
        - { username: ana@example.com, role: owner }
    outputPorts:
      - { name: orders, contractId: orders }
  sales-product.yaml: |
    apiVersion: v1.1.0
    kind: DataProduct
    id: sales
    name: Sales
    status: active
    description:
      purpose: Orders for reporting.
    team:
      members:
        - { username: ana@example.com, role: owner }
    outputPorts:
      - { name: orders, contractId: orders }

expect:
  diagnostics:
    - { code: PRODUCT_CONTRACT_SHARED, severity: error, file: sales-product.yaml }
