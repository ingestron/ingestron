description: "Quality rules on a table that ends at the landed files are NOT_APPLIED on the ingest step's pack, about the table and the rule's kind."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: none }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - name: total
            logicalType: number
            quality:
              - { metric: nullValues, mustBe: 0 }

expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 15
      message: 'The "nullValues" rule isn''t applied on test: the table ends at the landed files, and nothing checks them.'
      hint: Add a store step to have it checked.
      subject: { table: orders, feature: notNull }
