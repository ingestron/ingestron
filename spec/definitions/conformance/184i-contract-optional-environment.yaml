description: "The files of case 184h in the test environment: the flow's layer is raw there, so the table with no contract needs none, and its columns come from the source metadata."
environment: test
files:
  project.yaml: |
    id: retail
    environments:
      dev: { values: { layer: silver } }
      test: { values: { layer: bronze } }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse] }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    layer: ${values.layer}
    tables:
      orders: { object: ERP.dbo.Orders }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true }
expect:
  diagnostics: []
  tables:
    - name: orders
      layer: bronze
      contract:
        id: "erp:ERP.dbo.Orders"
        origin: metadata
        columns:
          - { name: id, logicalType: integer, nullable: true }
