description: A standard that names a method for a source it cannot reach is refused at the rule.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    ingest:
      default: managed
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: private
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: CONNECTIVITY_NOT_SUPPORTED
      file: standard.yaml
      line: 6
      column: 12
      fixes:
        - Use "copy" for this flow
        - Use "copy" for every private source
        - Add the "bridge" pack and use "bridge-copy" for this flow
  fixed:
    - diagnostic: 0
      title: Use "copy" for this flow
      files:
        sales.yaml: |
          apiVersion: ingestron.io/v1
          kind: Flow
          id: sales
          source: shop
          tables:
            orders: { object: orders, contract: orders }
          ingest:
            uses: copy
    - diagnostic: 0
      title: Use "copy" for every private source
      files:
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1]
          ingest:
            default: managed
            when:
              - connectivity: private
                use: copy
