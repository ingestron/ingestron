description: "A flow table with no contract whose object is written as one reference, or only references, with one unset at planning has no known name and so no columns yet: it is not TABLE_NO_COLUMNS, and only the unset variable is reported. A table whose object also has text is known, so a table of it with no contract and no metadata still is."
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    values: { schema: dbo }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      one: { object: "${envvar:TABLE}" }
      several: { object: "${values.schema}.${envvar:TABLE}" }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 7 }
