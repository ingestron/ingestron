description: "A cleansed column the contract does not list is CLEANSE_COLUMN, an error at the column's key in the flow table or transform, and the hint lists the contract's columns."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      customers:
        object: customers
        contract: customers
        cleanse:
          columns:
            emial: { case: lower }
            name: { trim: true }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, logicalType: string }
          - { name: name, logicalType: string }
  clean.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: customers_clean
    inputs: [customers]
    contract: customers
    cleanse:
      columns:
        phone: { trim: true }
expect:
  diagnostics:
    - code: CLEANSE_COLUMN
      severity: error
      file: sales.yaml
      line: 11
      message: '"emial" is not a column of contract "customers".'
      hint: "Use a column the contract lists: id, email, name."
    - code: CLEANSE_COLUMN
      severity: error
      file: clean.yaml
      line: 8
      message: '"phone" is not a column of contract "customers".'
      hint: "Use a column the contract lists: id, email, name."
