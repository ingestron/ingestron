description: "Each difference of a table from a full rung: a type that fits is information, a type that does not fit, a column the contract requires that is now nullable and a different key are breaking, each at the contract. An error has no subject (subject: null); the information has the column as its feature."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: integer }
          - { name: note, logicalType: string, logicalTypeOptions: { maxLength: 200 } }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: columns, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: false, primaryKeyPosition: 1 }
          - { name: total, logicalType: number, required: false }
          - { name: note, logicalType: string, logicalTypeOptions: { maxLength: 50 }, required: false, primaryKeyPosition: 2 }
expect:
  diagnostics:
    - code: SOURCE_NULLABLE
      severity: error
      file: sales.yaml
      line: 8
      message: 'Column "id" is required in contract "orders", but the source metadata for "ERP.dbo.Orders" says it can be null.'
      hint: "Make the column not required in the contract, or ask the source's owner whether it can be null."
      subject: null
    - code: SOURCE_TYPE_CHANGED
      severity: error
      file: sales.yaml
      line: 8
      hint: "Change the column's type in the contract to one the source's type fits, or ask the source's owner about the change."
      message: 'Column "total" is number in the source metadata for "ERP.dbo.Orders", but integer in contract "orders".'
      subject: null
    - code: SOURCE_TYPE_FITS
      severity: information
      file: sales.yaml
      line: 8
      hint: "Nothing breaks. Change the contract to the source's type if you want it exact."
      message: 'Column "note" is string(50) in the source metadata for "ERP.dbo.Orders", which fits string(200) in contract "orders".'
      subject: { table: orders, feature: note }
    - code: SOURCE_KEY_CHANGED
      severity: error
      file: sales.yaml
      line: 8
      message: 'The primary key of contract "orders" is (id), but the source metadata for "ERP.dbo.Orders" has (id, note).'
      hint: "Change the contract's primary key to the source's, or ask the source's owner about the change."
      subject: null
