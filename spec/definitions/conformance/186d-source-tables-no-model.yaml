description: "With the option, the source tables are given even when TABLE_NO_COLUMNS and CONTRACT_NEEDED leave no model: each table is listed, with its entry where it has one and, for a table that needs a contract, the reason, whether or not it names one."
environment: dev
sourceTables: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse] }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: ERP.dbo.Orders, contract: orders }
      invoices: { object: ERP.dbo.Invoices }
  ledger.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: ledger
    source: erp
    layer: silver
    tables:
      entries: { object: ERP.dbo.Entries }
      closing: { object: ERP.dbo.Orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      - object: ERP.dbo.Entries
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - { code: CONTRACT_NEEDED, severity: error, file: ledger.yaml, line: 7 }
    - { code: TABLE_NO_COLUMNS, severity: error, file: sales.yaml, line: 7 }
  sourceTables:
    - flow: ledger
      table: entries
      connection: erp
      object: ERP.dbo.Entries
      needs: its layer silver does cleanse
      entry:
        object: ERP.dbo.Entries
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: ledger
      table: closing
      connection: erp
      object: ERP.dbo.Orders
      contract: orders
      needs: its layer silver does cleanse
      entry:
        object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: orders
      connection: erp
      object: ERP.dbo.Orders
      contract: orders
      entry:
        object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
    - flow: sales
      table: invoices
      connection: erp
      object: ERP.dbo.Invoices
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
