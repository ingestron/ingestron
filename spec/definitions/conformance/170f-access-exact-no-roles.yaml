description: "With exact grants, a table that grants no role but whose keeping pack applies grants has access with no grants and exact true, so its direct grants are taken away too. A table whose pack applies no grants has none (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    governance:
      access: { grants: exact }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      manage: { grants: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      orders: { object: orders, contract: orders }
      returns: { object: returns, contract: returns }
  events.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: events
    source: shop
    tables:
      events: { object: events, contract: returns }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
    roles:
      - { role: finance-analysts }
  returns.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: returns
    version: 1.0.0
    status: draft
    schema:
      - name: returns
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
expect:
  tables:
    - name: events
      access: null
    - name: orders
      access:
        grants:
          - role: finance-analysts
            principal: finance-analysts
            privileges: [read]
            from: contract
        exact: true
        masks: []
        filters: []
    - name: returns
      access: { grants: [], exact: true, masks: [], filters: [] }
