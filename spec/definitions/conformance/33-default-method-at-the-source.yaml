description: A problem with a method nobody named, such as the pack's default, is reported at the flow's source.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: private
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  diagnostics:
    - code: CONNECTOR_NOT_SUPPORTED
      file: sales.yaml
      line: 4
      column: 9
      fixes:
        - Use "copy" for this flow
        - Use "copy" for every sqlserver source
        - Add the "bridge" pack and use "bridge-copy" for this flow
  fixed:
    - diagnostic: 0
      title: Add the "bridge" pack and use "bridge-copy" for this flow
      files:
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1, bridge@1]
        sales.yaml: |
          apiVersion: ingestron.io/v1
          kind: Flow
          id: sales
          source: shop
          tables:
            orders: { object: orders, contract: orders }
          ingest:
            uses: bridge-copy
