description: On a table that ends at the landed files, a rule that cannot be checked as written stays QUALITY_RULE_NOT_CHECKED, while the flow table's own expectation is NOT_APPLIED on the ingest step's pack.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: none }
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive_total, check: total >= 0 }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        quality:
          - { type: custom, engine: soda, implementation: "row_count > 0" }
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }
expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 11
      message: 'Expectation "positive_total" isn''t applied on test: the table ends at the landed files, and nothing checks them.'
      hint: Add a store step to have it checked.
      subject: { table: orders, feature: expectations }
    - code: QUALITY_RULE_NOT_CHECKED
      severity: warning
      file: orders.odcs.yaml
      line: 10
      message: "A custom rule is not checked: Ingestron does not run other engines' checks."
      subject: { table: orders }
