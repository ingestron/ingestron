description: "Cleansing in a layer whose does leaves out cleanse, and deduplicate in a layer whose does leaves out deduplicate, are LAYER_RESPONSIBILITY, an error at the setting, and the hint names the layers that do it. A table that writes only trim false or empty false asks nothing of its layer."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse, deduplicate, check] }
      - { name: gold, does: [check] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        cleanse:
          columns:
            name: { trim: true }
          deduplicate: { order_by: [updated_at] }
      returns:
        object: returns
        contract: orders
        cleanse:
          columns:
            name: { trim: false }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: name, logicalType: string }
          - { name: updated_at, logicalType: timestamp }
  a_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    inputs: [orders]
    contract: orders
    layer: gold
    cleanse:
      deduplicate: { order_by: [updated_at] }
expect:
  diagnostics:
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: sales.yaml
      line: 11
      message: 'The layer "bronze" does not list cleanse in its does, so cleansing cannot be set here.'
      hint: "Layers that do cleanse: silver. Or add `cleanse` to this layer's `does`."
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: sales.yaml
      line: 12
      message: 'The layer "bronze" does not list deduplicate in its does, so deduplicating cannot be set here.'
      hint: "Layers that do deduplicate: silver. Or add `deduplicate` to this layer's `does`."
    - code: LAYER_RESPONSIBILITY
      severity: error
      file: a_top.yaml
      line: 8
      message: 'The layer "gold" does not list deduplicate in its does, so deduplicating cannot be set here.'
      hint: "Layers that do deduplicate: silver. Or add `deduplicate` to this layer's `does`."
