description: "A scale given with no precision is named as number(scale N) in the message of SOURCE_TYPE_CHANGED, here a number with a scale of 2 against an integer. An error has no subject (subject: null)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: price, logicalType: integer }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: columns, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: price, logicalType: number, logicalTypeOptions: { scale: 2 }, required: false }
expect:
  diagnostics:
    - code: SOURCE_TYPE_CHANGED
      severity: error
      file: sales.yaml
      line: 8
      hint: "Change the column's type in the contract to one the source's type fits, or ask the source's owner about the change."
      message: 'Column "price" is number(scale 2) in the source metadata for "ERP.dbo.Orders", but integer in contract "orders".'
      subject: null
