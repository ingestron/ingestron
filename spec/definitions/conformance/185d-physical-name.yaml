description: "A contract column matches the metadata's by its physicalName, with case ignored when names.caseSensitive is false, so name email with physicalName EMAIL_ADDR matches email_addr and nothing is reported."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, physicalName: EMAIL_ADDR, logicalType: string }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: email_addr, logicalType: string, required: false }
expect:
  diagnostics: []
