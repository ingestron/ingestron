description: A method's own coverage is found before its pack's, so a load mode the pack uses can be not-yet on one method. Only the judging step's method is asked.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    load: { default: changes }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  refunds.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: refunds
    source: shop
    ingest: { uses: copy, with: { landing: /landing } }
    tables:
      refunds: { object: refunds, contract: refunds }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: refunds
      ingest: { method: copy }
    - name: orders
      ingest: { method: files }
  previewFeatures:
    - table: orders
      path: load.mode
      value: changes
      pack: test
      status:
        level: preview
        label: Beta
        checked: "2026-11-09"
        source: "https://example.com/changes"
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: standard.yaml
      line: 5
      message: "load.mode: changes isn't applied on test: It copies whole files and reads no change feed."
