description: "A flow table with no contract and no source metadata has no columns: TABLE_NO_COLUMNS, an error at the table, with the hint to import the metadata or name a contract."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: ERP.dbo.Orders }
expect:
  diagnostics:
    - code: TABLE_NO_COLUMNS
      severity: error
      file: sales.yaml
      line: 6
      message: '"orders" has no contract and no source metadata, so it has no columns.'
      hint: "Import the source's metadata (ingestron source request says how), or name a contract."
