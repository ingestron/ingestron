description: "A moved field goes into a databricks section just above it that holds another field, whole, and the field at the top goes: both edits are made against the same text."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    databricks:
      governance:
        unmasked: [data-stewards]
    manage: { schemas: true, tags: true }
    tags: { a: b }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 7
      fixes: [Move to databricks.manage]
  fixed:
    - diagnostic: 0
      title: Move to databricks.manage
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lakehouse
          databricks:
            governance:
              unmasked: [data-stewards]
            manage:
              schemas: true
              tags: true
          tags: { a: b }
