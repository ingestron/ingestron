description: "Quality quarantine on the standard reaches only tables in layers whose does lists quarantine, and is silent elsewhere. A table that quarantines has a quarantine table in the same schema, <table>_quarantine, and the column _failed_checks. A table's own quarantine false wins."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { default: drop, quarantine: true }
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse, check, quarantine] }
      - { name: gold, does: [check] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive, check: total > 0, action: warn }
  a_clean.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: clean
    inputs: [orders]
    contract: orders
    expectations:
      - { name: small, check: total < 100 }
  b_kept.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: kept
    inputs: [orders]
    contract: orders
    quality: { quarantine: false }
    expectations:
      - { name: small, check: total < 100 }
  c_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    layer: gold
    inputs: [clean]
    contract: orders
    expectations:
      - { name: small, check: total < 100 }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - name: orders
      quality: null
      quarantine: null
      qualityOrigins:
        default: { layer: standard, file: standard.yaml, line: 5 }
    - name: clean
      quality: { quarantine: true }
      quarantine:
        fullName: { catalog: dev, schema: silver, table: clean_quarantine }
        column: _failed_checks
      qualityOrigins:
        quarantine: { layer: standard, file: standard.yaml, line: 5 }
    - name: kept
      quality: { quarantine: false }
      quarantine: null
      qualityOrigins:
        quarantine: { layer: definition, file: b_kept.yaml, line: 6 }
    - name: top
      quality: null
      quarantine: null
  diagnostics: []
