description: "With masks on for the pack that keeps a table, a platform whose section gives no run_as is MASK_NEEDS_RUN_AS, an error at manage.masks: every policy lets run_as see real values (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    governance:
      masks: { confidential: hash }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      manage: { tags: true, masks: true }
      governance: { functions: main.governance }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      customers: { object: customers, contract: customers }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: email, logicalType: string, classification: confidential }
expect:
  diagnostics:
    - code: MASK_NEEDS_RUN_AS
      severity: error
      file: platform.yaml
      line: 5
      message: "Masks and filters on databricks need run_as, the principal the pipeline runs as, so it reads real values."
      hint: Give databricks.run_as.
