description: "An output no table builds in this environment is a warning, and the project still resolves."
environment: local
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, local: { runs-on: local } }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [local@1, test@1]
    ingest:
      settings:
        local-landed: { landing: ./samples }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: sqlserver
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: total, logicalType: number }
  sales-product.yaml: |
    apiVersion: v1.1.0
    kind: DataProduct
    id: sales
    name: Sales
    status: active
    description:
      purpose: Orders for reporting.
    team:
      members:
        - { username: ana@example.com, role: owner }
    outputPorts:
      - { name: orders, contractId: orders }

expect:
  diagnostics:
    - { code: RUNS_ON_SKIPPED, severity: warning, file: sales.yaml }
    - { code: PRODUCT_NOT_BUILT, severity: warning, file: sales-product.yaml }
