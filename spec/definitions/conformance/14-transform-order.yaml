description: A transform listed before its input in path order still comes after it.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  a_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    inputs: [daily]
    code: "SELECT * FROM {{ tables.daily }}"
    contract: top
  b_daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: daily
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  top.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: top
    version: 1.0.0
    status: draft
    schema:
      - name: top
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
    - name: daily
    - name: top
