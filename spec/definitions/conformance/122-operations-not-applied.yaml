description: When no pack of the standard declares operations used, each operations value other than a default is NOT_APPLIED, a warning where the standard wrote it, naming the first pack.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    operations:
      retries: { count: 2, interval: 5m }
      trigger: schedule
      alerts: { on: [failure] }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: standard.yaml
      line: 6
      message: 'operations.retries: {"count":2,"interval":"5m"} isn''t applied on test: No pack of this standard runs jobs.'
      fixes: []
  operations:
    schedule: { per: project }
    trigger: schedule
    retries: { count: 2, interval: 5m }
    alerts: { on: [failure] }
    require_tags: []
