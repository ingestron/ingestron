description: "Applied masks that are built in or one-part functions, and applied filters with a one-part function, need governance.functions in the pack's section; without it they are MASK_FUNCTIONS, one error at manage.masks naming each once. A three-part function needs none (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    governance:
      masks:
        confidential: hash
        internal: mask_internal
        restricted: main.governance.mask_card
      filters:
        region_rows: { function: region_filter, match: { tag: region } }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      run_as: { service_principal_name: etl-runner }
      manage: { tags: true, masks: true, filters: true }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      customers: { object: customers, contract: customers }
      prospects: { object: prospects, contract: customers }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: email, logicalType: string, classification: confidential }
          - { name: notes, logicalType: string, classification: internal }
          - { name: card, logicalType: string, classification: restricted }
          - { name: country, logicalType: string, tags: [region] }
expect:
  diagnostics:
    - code: MASK_FUNCTIONS
      severity: error
      file: platform.yaml
      line: 6
      message: 'Masks and filters on databricks need governance.functions, the schema that holds the "hash" mask, the function "mask_internal", the function "region_filter".'
      hint: "Give databricks.governance.functions, such as ${values.governance_schema}."
