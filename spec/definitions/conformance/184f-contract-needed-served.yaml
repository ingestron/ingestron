description: "A table that ends at the landed files and is served by a serve step has access resolved on the serve step's pack, so it needs a contract when the platform manages grants for that pack, and the reason names the serving pack."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, views@1]
    layers:
      - { name: bronze, does: raw }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    views:
      manage: { grants: true }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    store: { uses: none }
    serve: { uses: file-serve }
    tables:
      orders: { object: ERP.dbo.Orders }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, sourceType: int, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 8
      message: '"orders" needs a contract: access is managed for it on views.'
