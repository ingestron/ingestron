description: "With manage.checks off, a table kept by a pack that declares no checks capability still gets its contract's table checks and a column's unique, and nothing is reported: checks are on per pack (section 7.1). Case 137a is the same rule for a pack that declares the capability."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [quality@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: source
    store: { uses: quality-counts }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        quality:
          - { metric: rowCount, mustBeGreaterThan: 0 }
        properties:
          - { name: id, logicalType: integer, unique: true }
expect:
  diagnostics: []
  tables:
    - contract:
        tableChecks:
          - {
              name: orders_rowcount,
              metric: rowCount,
              columns: [],
              operator: mustBeGreaterThan,
              value: 0,
              unit: rows,
              action: warn,
            }
          - {
              name: id_unique,
              metric: duplicateValues,
              columns: [id],
              operator: mustBe,
              value: 0,
              unit: rows,
              action: warn,
            }
