description: Without environmentsTogether, mode defaults as before definitions 1.8, so test is deployed in development mode with its schedule paused.
environment: test
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    schedule: { cron: '0 0 6 * * ?' }
expect:
  platform:
    mode: development
    schedule:
      cron: 0 0 6 * * ?
      timezone: UTC
      paused: true
  tables:
    - fullName: test.bronze.orders
