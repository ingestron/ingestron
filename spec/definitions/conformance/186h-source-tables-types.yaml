description: "A source table lists, as types, each column whose type from the metadata (the first pack's metadataType) is not the one its logical type alone gives: a money column's DECIMAL(19,4) and a decimal's DECIMAL(18,2), not the DOUBLE of a plain number. A column the mapping gives its logical type's own type for (int as BIGINT), or no type for, is not listed. A contract keeps these only as physicalType."
environment: dev
sourceTables: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [exact@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: exact
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: ERP.dbo.Orders }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, sourceType: int, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: freight, sourceType: money, logicalType: number, required: false }
          - { name: rate, sourceType: float, logicalType: number, required: false }
          - { name: total, sourceType: "decimal(18,2)", logicalType: number, logicalTypeOptions: { precision: 18, scale: 2 }, required: false }
expect:
  diagnostics: []
  tables:
    - {
        name: orders,
        contract:
          {
            id: "erp:ERP.dbo.Orders",
            origin: metadata,
            columns:
              [
                { name: id, type: BIGINT },
                { name: freight, type: "DECIMAL(19,4)" },
                { name: rate, type: DOUBLE },
                { name: total, type: "DECIMAL(18,2)" },
              ],
          },
      }
  sourceTables:
    - flow: sales
      table: orders
      connection: erp
      object: ERP.dbo.Orders
      entry:
        object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - {
              name: id,
              sourceType: int,
              logicalType: integer,
              required: true,
              primaryKeyPosition: 1,
            }
          - { name: freight, sourceType: money, logicalType: number, required: false }
          - { name: rate, sourceType: float, logicalType: number, required: false }
          - {
              name: total,
              sourceType: "decimal(18,2)",
              logicalType: number,
              logicalTypeOptions: { precision: 18, scale: 2 },
              required: false,
            }
      names: { parts: 3, caseSensitive: false }
      file: sources/erp.yaml
      types: { freight: "DECIMAL(19,4)", total: "DECIMAL(18,2)" }
