# The data-only pack every conformance case uses.
id: test
version: 1
# The Platform fields it reads (section 7), each a field of the Platform schema.
platformFields: [mode, compute.serverless, schedule.paused, manage.checks]
defaults:
  naming:
    catalog: "{{ environment }}"
    schema: "{{ layer }}"
    table: "{{ table }}"
    pipeline: "{{ project }}"
    job: "{{ project }}_refresh"
  layers: [bronze, silver, gold]
  types:
    {
      string: STRING,
      integer: BIGINT,
      number: DOUBLE,
      boolean: BOOLEAN,
      date: DATE,
      timestamp: TIMESTAMP,
    }
  quality: { required: warn, default: warn }
rules:
  ingest:
    default: files
    when:
      - { connector: sqlserver, use: managed }
  transform: { default: sql }
  store:
    default: stream
    when:
      - { input: query, use: view }
methods:
  files:
    action: ingest
    description: Reads files where they are.
    connectors: [files]
    produces: files
    defaults: { format: parquet }
    settings:
      type: object
      additionalProperties: false
      properties: { format: { enum: [parquet, csv, json] } }
  copy:
    action: ingest
    description: Copies to a landing folder first.
    connectors: [files, sqlserver]
    produces: files
    # What differs on this method from the pack's coverage (section 11.5).
    intent:
      load.mode=changes: { use: not-yet, reason: It copies whole files and reads no change feed. }
    settings:
      type: object
      additionalProperties: false
      required: [landing]
      properties: { landing: { type: string } }
  share:
    action: ingest
    description: Copies files from a share, with settings in three places.
    connectors: [files]
    produces: files
    placement: { platform: [landing], standard: [every] }
    settings:
      type: object
      additionalProperties: false
      required: [landing, every, format]
      properties:
        landing: { type: string }
        every: { type: string }
        format: { enum: [csv, json] }
  managed:
    action: ingest
    description: Writes tables directly.
    connectors: [sqlserver]
    connectivity: [public, workspace]
    produces: table
    settings: { type: object }
  sql:
    action: transform
    description: Runs SQL.
    accepts: [table]
    produces: query
    settings: { type: object, additionalProperties: false }
  stream:
    action: store
    description: Streaming table.
    accepts: [files]
    produces: table
    defaults: { cluster: auto, properties: { quality: raw } }
    # The intent it applies when nothing declares it, and its settings that are
    # other names for intent (sections 11.3 and 11.4).
    intentDefaults: { history: none }
    aliases:
      mode: { values: { append: { history: none }, upsert: { history: latest } } }
      sequence_by: { path: sequence }
    settings:
      type: object
      additionalProperties: false
      properties:
        cluster: { enum: [auto, none] }
        cluster_by: { anyOf: [{ enum: [auto, none] }, { type: array, items: { type: string } }] }
        retries: { type: integer }
        # snapshot is a mode no alias value lists: it stands for no intent.
        mode: { enum: [append, upsert, snapshot] }
        sequence_by: { type: string }
        properties: { type: object }
  view:
    action: store
    description: Materialised view.
    accepts: [files, table, query]
    produces: table
    settings:
      type: object
      additionalProperties: false
      properties: { cluster: { enum: [auto, none] } }
  publish:
    action: serve
    description: Makes the table available elsewhere.
    accepts: [table, files]
    produces: table
    settings: { type: object }
  publish-files:
    action: serve
    description: Makes the table's files available elsewhere, from where they land.
    accepts: [table, files]
    produces: table
    needsOutput: true
    settings: { type: object }
contract:
  schema.*.properties.*.name: { use: used, does: The column's name. }
  schema.*.properties.*.physicalName: { use: used, does: Renamed when read. }
  schema.*.properties.*.unique: { use: used, does: Checked after each refresh., needs: checks }
  schema.*.properties.*.encryptedName: { use: not-yet, reason: Columns are not decrypted yet. }
  schema.*.properties.*.description: { use: documentation }
  schema.*.properties.*.tags: { use: used, does: Tags the column., needs: tags }
# What it does with intent paths and values (section 11.5). A path or value it
# does not list reports nothing.
intent:
  history=full: { use: not-yet, reason: History is not kept yet. }
  load.mode=changes:
    use: used
    does: Reads the source's change feed.
    status:
      level: preview
      label: Beta
      checked: "2026-11-09"
      source: "https://example.com/changes"
  storage: { use: elsewhere, reason: The platform team lays out storage. }
capabilities:
  - { id: tags, title: Tags, does: Tags tables and columns., needs: [APPLY TAG on the tables] }
  - id: checks
    title: Checks
    does: Counts over all rows after each refresh.
    needs: [SELECT on the tables]
