description: "A table that ends at the landed files cleanses nothing: each operation it writes and its deduplicate are NOT_APPLIED on the ingest step's pack, with a hint to add a store step. The standard's defaults do not reach it."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [quality@1]
    cleanse:
      text: { trim: true }
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: source
    store: { uses: none }
    tables:
      customers:
        object: customers
        contract: customers
        cleanse:
          columns:
            name: { case: lower }
          deduplicate: { order_by: [updated_at] }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: name, logicalType: string }
          - { name: updated_at, logicalType: timestamp }
expect:
  tables:
    - name: customers
      cleanse: { columns: { name: { trim: null, case: lower } } }
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 12
      message: 'Cleansing "case" of "name" isn''t applied on quality: the table ends at the landed files, and nothing cleanses them.'
      hint: Add a store step to have it cleansed.
      subject: { table: customers, feature: cleanse.case }
    - code: NOT_APPLIED
      severity: warning
      file: sales.yaml
      line: 13
      message: "Deduplicate isn't applied on quality: the table ends at the landed files, and nothing cleanses them."
      hint: Add a store step to have it cleansed.
      subject: { table: customers, feature: deduplicate }
