description: A time zone of the triggers policy that is not on the IANA list is TIMEZONE_NAME, an error at the name in the standard.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    operations:
      triggers:
        types: [schedule]
        timezone: Mars/Base
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: TIMEZONE_NAME
      severity: error
      file: standard.yaml
      line: 8
      message: '"Mars/Base" is not a time zone name.'
      hint: "Use a name from the IANA time zone database, such as Europe/London, or UTC."
