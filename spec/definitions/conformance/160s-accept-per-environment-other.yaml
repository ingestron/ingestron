description: "In the environment that overrides values.accept with an empty list, and where the warning does not occur, nothing is accepted and nothing is unused."
environment: prod
files:
  project.yaml: |
    id: retail
    values:
      tags: false
      accept:
        - code: CAPABILITY_OFF
          about: { feature: tags }
          reason: The platform team applies the tags with its own Terraform.
    environments:
      dev: {}
      prod:
        values:
          tags: true
          accept: []
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    manage: { tags: "${values.tags}" }
    accept: "${values.accept}"
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, logicalType: string, tags: [pii] }
expect:
  diagnostics: []
  accepted: []
