description: "A table in a layer with no duty, with no contract and history latest takes its key from the source metadata, by primaryKeyPosition, so deduplicate finds a key and reports no DEDUPLICATE_KEY."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    history: latest
    tables:
      orders:
        object: ERP.dbo.Orders
        cleanse:
          deduplicate: { order_by: [updated_at] }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: region, logicalType: string, required: true, primaryKeyPosition: 2 }
          - { name: updated_at, logicalType: timestamp, required: false }
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics: []
  tables:
    - name: orders
      intent: { history: latest }
      contract:
        primaryKey: [id, region]
