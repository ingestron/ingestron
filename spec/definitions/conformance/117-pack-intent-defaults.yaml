description: The chosen method's intent defaults fill what nothing declares, with the origin pack. They never write an aliased setting, so the settings stay as they were.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      intent: { history: none }
      intentOrigins:
        history: { layer: pack, file: null, line: null }
      store:
        method: stream
        settings:
          cluster: auto
          properties: { quality: raw }
          mode: null
          sequence_by: null
        origins:
          cluster: { layer: pack }
          properties: { layer: pack }
          mode: null
