description: A standard's fixed value for an aliased setting is fixed intent for that method's tables, so a flow that writes the intent differently is FIXED_SETTING.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    store:
      fixed:
        stream: { mode: append }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    history: latest
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: FIXED_SETTING
      severity: error
      file: sales.yaml
      line: 5
      message: The standard fixes "history" to "none".
      fixes: [Remove this setting]
  fixed:
    - diagnostic: 0
      title: Remove this setting
      files:
        sales.yaml: |
          apiVersion: ingestron.io/v1
          kind: Flow
          id: sales
          source: shop
          tables:
            orders: { object: orders, contract: orders }
