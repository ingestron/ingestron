# A data-only pack whose ingest and store methods both give intent defaults, and
# whose store has a setting that stands for intent on two paths (sections 11.3
# and 11.4). Its connector is its own, so it offers no fixes in the other cases.
id: intent
version: 1
defaults:
  naming:
    catalog: "{{ environment }}"
    schema: "{{ layer }}"
    table: "{{ table }}"
    pipeline: "{{ project }}"
    job: "{{ project }}_refresh"
  layers: [bronze, silver, gold]
  types:
    {
      string: STRING,
      integer: BIGINT,
      number: DOUBLE,
      boolean: BOOLEAN,
      date: DATE,
      timestamp: TIMESTAMP,
    }
  quality: { required: warn, default: warn }
rules:
  ingest: { default: intent-copy }
  store: { default: intent-table }
methods:
  intent-copy:
    action: ingest
    description: Copies a source's files to a landing folder.
    connectors: [intent]
    produces: files
    intentDefaults:
      load: { mode: files }
      history: none
      audit: [{ value: source_file, as: _source_file }]
    # It lands files; the store step applies deletes (section 11.5).
    intent:
      load.deletes: { use: not-applicable, reason: It copies files and applies no deletes. }
    settings: { type: object }
  intent-table:
    action: store
    description: Keeps the landed files as a table.
    accepts: [files]
    produces: table
    intentDefaults:
      load: { mode: full }
      history: latest
      audit: [{ value: loaded_at, as: _loaded_at }]
    aliases:
      mode:
        values:
          replace: { load: { mode: full }, history: none }
          upsert: { history: latest }
    intent:
      load.deletes.when: { use: not-yet, reason: A delete condition is not applied yet. }
    settings:
      type: object
      additionalProperties: false
      properties: { mode: { enum: [replace, upsert] } }
