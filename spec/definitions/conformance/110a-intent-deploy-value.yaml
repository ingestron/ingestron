description: Resolved for deploy, a history that holds a deploy-time value is DEPLOY_VALUE, as it decides what is generated.
environment: dev
deployTime: true
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
      refunds: { object: refunds, contract: refunds, history: "${envvar:H}" }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: DEPLOY_VALUE
      severity: error
      file: sales.yaml
      line: 7
