description: Settings merge pack defaults, standard settings, flow and table settings in that order; fixed settings cannot change; each setting records the layer that set it.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    store:
      settings:
        stream: { cluster: none, properties: { owner: data } }
      fixed:
        stream: { mode: append }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store:
      with: { cluster: auto }
    tables:
      orders: { object: orders, contract: orders }
      refunds:
        object: refunds
        contract: refunds
        store: { with: { properties: { quality: checked } } }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      store:
        method: stream
        settings:
          cluster: auto
          mode: append
          properties:
            quality: raw
            owner: data
        origins:
          cluster: { layer: definition, file: sales.yaml }
          mode: { layer: fixed, file: standard.yaml }
          properties: { layer: standard, file: standard.yaml }
    - name: refunds
      store:
        method: stream
        settings:
          cluster: auto
          mode: append
          properties:
            quality: checked
            owner: data
        origins:
          cluster: { layer: definition, file: sales.yaml }
          mode: { layer: fixed, file: standard.yaml }
          properties: { layer: table, file: sales.yaml }
