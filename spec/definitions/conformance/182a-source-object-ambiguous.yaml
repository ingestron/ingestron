description: "A flow table's object that matches more than one table of the connection's source metadata is SOURCE_OBJECT_AMBIGUOUS, an error at the object, naming every match."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      customers: { object: Customers, contract: customers }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        description: One row per customer.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: CustomerID, logicalType: integer, required: true, primaryKeyPosition: 1 }
      - object: CRM.dbo.Customers
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: CustomerID, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - code: SOURCE_OBJECT_AMBIGUOUS
      severity: error
      file: sales.yaml
      line: 6
      message: '"Customers" matches more than one table of the source metadata for "erp": ERP.dbo.Customers, CRM.dbo.Customers.'
