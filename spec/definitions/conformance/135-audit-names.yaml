description: Each audit column has a name of its own. An entry whose name an earlier entry has, or that a contract column has (without case), is BAD_SETTING at that entry where the list was written.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    audit: [loaded_at, { value: run_id, as: _loaded_at }]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
      refunds:
        object: refunds
        contract: refunds
        audit:
          - { value: loaded_at, as: amount }
          - source_file
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  refunds.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: refunds
    version: 1.0.0
    status: draft
    schema:
      - name: refunds
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: Amount, logicalType: number }
expect:
  diagnostics:
    - code: BAD_SETTING
      severity: error
      file: standard.yaml
      line: 5
      column: 20
      message: 'The audit column "_loaded_at" is named twice.'
      hint: Give each audit column a name of its own with "as".
    - code: BAD_SETTING
      severity: error
      file: sales.yaml
      line: 11
      message: 'The audit column "amount" has the name of a contract column.'
