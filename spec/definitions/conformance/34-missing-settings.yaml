description: Settings nobody set are one problem at the flow, fixed by adding each key, empty, where it belongs.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    ingest: { uses: share }
    tables:
      orders: { object: orders, contract: orders }
      returns: { object: returns, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: BAD_SETTING
      file: sales.yaml
      line: 4
      column: 9
      fixes: [Add the missing settings]
  fixed:
    - diagnostic: 0
      title: Add the missing settings
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lake
          settings:
            share:
              landing: null
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1]
          ingest:
            settings:
              share:
                every: null
        sales.yaml: |
          apiVersion: ingestron.io/v1
          kind: Flow
          id: sales
          source: shop
          ingest: { uses: share, with: { format: null } }
          tables:
            orders: { object: orders, contract: orders }
            returns: { object: returns, contract: orders }
