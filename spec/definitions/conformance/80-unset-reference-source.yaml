description: With missingEnvvars information, a flow's source or layer that holds an unset reference names something not known yet. It is not reported as not found, and the table stays. The layer is the text as written. The connection is not known, so no rule on its connector or connectivity matches, and the ingest method's connectors and connectivity are not checked. A contract that holds one leaves its table out, with only the information.
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  refunds.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: refunds
    source: shop
    tables:
      refunds: { object: refunds, contract: "${envvar:CONTRACT}" }
  returns.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: returns
    source: shop
    layer: ${envvar:LAYER}
    tables:
      orders: { object: returns, contract: orders }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: ${envvar:SOURCE}
    tables:
      orders_in: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
      - name: orders_in
        logicalType: object
        properties:
          - { name: id, logicalType: integer }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: refunds.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: returns.yaml, line: 5 }
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 4 }
  tables:
    - name: orders
      layer: ${envvar:LAYER}
      fullName: dev.${envvar:LAYER}.orders
      ingest: { method: files, connection: { id: shop } }
    - name: orders_in
      layer: bronze
      fullName: dev.bronze.orders_in
      ingest:
        method: files
        chosenBy: { by: pack-default }
        connection: { id: "${envvar:SOURCE}", settings: {} }
