description: With missingEnvvars information, a flow's source or layer that holds an unset reference names something not known yet. It is not reported as not found, and the table stays. The layer is the text as written. The connection is not known, so the ingest method is known only when the flow names it with uses, and then the connection's connector and connectivity are not checked. Otherwise the table has no steps, and none of their settings are checked. A contract that holds one leaves its table out, with only the information.
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  copies.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: copies
    source: ${envvar:SOURCE}
    ingest:
      uses: copy
      with: { landing: /landing/copies }
    tables:
      copies: { object: copies, contract: orders }
  refunds.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: refunds
    source: shop
    tables:
      refunds: { object: refunds, contract: "${envvar:CONTRACT}" }
  returns.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: returns
    source: shop
    layer: ${envvar:LAYER}
    tables:
      orders: { object: returns, contract: orders }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: ${envvar:SOURCE}
    ingest:
      with: { landing: /landing/orders } # files, the pack's default, has no landing
    tables:
      orders_in: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
      - name: orders_in
        logicalType: object
        properties:
          - { name: id, logicalType: integer }
      - name: copies
        logicalType: object
        properties:
          - { name: id, logicalType: integer }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: copies.yaml, line: 4 }
    - { code: ENVVAR_MISSING, severity: information, file: refunds.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: returns.yaml, line: 5 }
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 4 }
  tables:
    - name: copies
      sourceNotKnown: ${envvar:SOURCE}
      ingest:
        method: copy
        chosenBy: { by: definition }
        settings: { landing: /landing/copies }
        connection: { id: "${envvar:SOURCE}", settings: {} }
      store: { method: stream }
    - name: orders
      layer: ${envvar:LAYER}
      fullName: dev.${envvar:LAYER}.orders
      ingest: { method: files, connection: { id: shop } }
    - name: orders_in
      layer: bronze
      fullName: dev.bronze.orders_in
      sourceNotKnown: ${envvar:SOURCE}
      ingest: null # no uses names the method, so it is not known
      store: null
      serve: null
