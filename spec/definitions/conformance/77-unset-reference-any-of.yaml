description: With missingEnvvars information, an unset reference in a setting whose schema is an anyOf of mixed types, such as an enum or a list, meets the enum as far as can be known. The anyOf is not reported, only the information remains, and the table resolves with the text as written.
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store:
      with: { cluster_by: "${envvar:CLUSTER}" }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 6 }
  tables:
    - name: orders
      fullName: dev.bronze.orders
      store: { method: stream, settings: { cluster_by: "${envvar:CLUSTER}" } }
