description: A section for an available pack the standard does not name is UNKNOWN_PACK at the key, with a fix that adds the pack.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lakehouse
    databricks: {}
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - code: UNKNOWN_PACK
      severity: error
      file: platform.yaml
      line: 4
      fixes: [Add the "databricks" pack]
  fixed:
    - diagnostic: 0
      title: Add the "databricks" pack
      files:
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1, databricks@1]
