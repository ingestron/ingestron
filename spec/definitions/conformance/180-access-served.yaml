description: "A table one pack stores and another pack serves is judged a second time by the serve step: its grants are applied by the serving pack, and the mask and write access it cannot apply are NOT_APPLIED naming that pack, recorded in the serve step's notApplied, not the table's (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1, views@1]
    governance:
      masks: { confidential: hash }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      run_as: { service_principal_name: etl-runner }
      manage: { tags: true, grants: true, masks: true }
      governance: { functions: main.governance }
    views:
      manage: { grants: true }
  lake.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: lake
    source: shop
    store: { uses: uc-table }
    serve: { uses: file-serve }
    tables:
      customers: { object: customers, contract: customers }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: email, logicalType: string, classification: confidential }
    roles:
      - { role: marketing-analysts, access: read }
      - { role: etl-writers, access: write }
expect:
  tables:
    - name: customers
      notApplied: null
      serve:
        method: file-serve
        notApplied:
          - { feature: write, reason: Views are read-only. }
          - { feature: masks, reason: It has no data masking., column: email }
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: customers.odcs.yaml
      line: 14
      message: 'Write access for the role "etl-writers" in table "customers" isn''t applied on views: Views are read-only.'
      subject: { table: customers, feature: write }
    - code: NOT_APPLIED
      severity: warning
      file: customers.odcs.yaml
      line: 11
      message: 'The "hash" mask on "email" in table "customers" isn''t applied on views: It has no data masking.'
      subject: { table: customers, feature: masks }
