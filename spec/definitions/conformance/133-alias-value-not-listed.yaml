description: A written setting value the alias does not list stands for no intent and is never written from intent. A layer's history, later in the precedence, would have made it another value, so the history is NOT_APPLIED where the layer wrote it, naming the setting that decides.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, history: latest }
      - silver
      - gold
    store:
      settings:
        stream: { mode: snapshot }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      intent: { history: latest }
      intentOrigins:
        history: { layer: layer, file: standard.yaml, line: 6 }
      store:
        method: stream
        settings: { mode: snapshot }
        origins:
          mode: { layer: standard, file: standard.yaml, line: 11 }
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: standard.yaml
      line: 6
      message: 'history: latest isn''t applied on test: the setting "mode: snapshot" in standard.yaml decides it.'
