description: "Masks match columns by their classification tags, so manage.masks on with manage.tags off is CAPABILITY_OFF at manage.masks, with the capability tags and its fix (section 7.1). The masks are still resolved and applied."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
    governance:
      masks: { confidential: hash }
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    databricks:
      run_as: { service_principal_name: etl-runner }
      manage: { masks: true }
      governance: { functions: main.governance }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store: { uses: uc-table }
    tables:
      customers: { object: customers, contract: customers }
  customers.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: customers
    version: 1.0.0
    status: draft
    schema:
      - name: customers
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: email, logicalType: string, classification: confidential }
expect:
  tables:
    - name: customers
      access:
        grants: []
        exact: false
        masks: [{ column: email, classification: confidential, mask: hash }]
        filters: []
      notApplied: null
  diagnostics:
    - code: CAPABILITY_OFF
      severity: warning
      file: platform.yaml
      line: 6
      message: "Masks are not applied: the platform has Tags off."
      hint: "Turn it on with databricks.manage.tags in platform.yaml. It needs: APPLY TAG on the tables."
      fixes: [Turn on manage.tags]
      subject: { feature: tags }
  fixed:
    - diagnostic: 0
      title: Turn on manage.tags
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lake
          databricks:
            run_as: { service_principal_name: etl-runner }
            manage: { masks: true, tags: true }
            governance: { functions: main.governance }
