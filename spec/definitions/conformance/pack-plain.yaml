# A data-only pack at version 2 that builds one environment at a time, for
# PACK_VERSION. Its connector is its own, so it offers no fixes in the cases
# that use the other packs.
id: plain
version: 2
defaults:
  naming:
    catalog: "{{ environment }}"
    schema: "{{ layer }}"
    table: "{{ table }}"
    pipeline: "{{ project }}"
    job: "{{ project }}_refresh"
  layers: [bronze, silver, gold]
  types:
    {
      string: STRING,
      integer: BIGINT,
      number: DOUBLE,
      boolean: BOOLEAN,
      date: DATE,
      timestamp: TIMESTAMP,
    }
  quality: { required: warn, default: warn }
rules:
  ingest: { default: plain-copy }
methods:
  plain-copy:
    action: ingest
    description: Copies a source's files to a landing folder.
    connectors: [plain]
    produces: files
    settings: { type: object }
