description: "A table that needs a contract has the same message whether or not the metadata has it, and the hint says how to draft one when the metadata has the table: the command names the flow's id and the table's key. Without an entry the hint says to name a contract."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse] }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    layer: silver
    tables:
      orders: { object: ERP.dbo.Orders }
      customers: { object: ERP.dbo.Customers }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, file: erp.csv }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
expect:
  diagnostics:
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 7
      message: '"orders" needs a contract: its layer silver does cleanse.'
      hint: "Draft one from the source metadata with `ingestron contract --from-metadata sales.orders`, then name it with `contract`."
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 8
      message: '"customers" needs a contract: its layer silver does cleanse.'
      hint: "Name a contract for the table with `contract`."
