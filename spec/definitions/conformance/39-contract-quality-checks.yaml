description: The expectations a contract's row rules become, after the required checks.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { default: drop }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - name: unit
            logicalType: string
            quality:
              - { metric: invalidValues, arguments: { validValues: [kg, "o'z"] }, mustBe: 0 }
              - { name: unit_known, metric: missingValues, arguments: { missingValues: [null, "", N/A] }, mustBeLessThan: 1 }
              - { metric: invalidValues, arguments: { pattern: "^[a-z]+$" }, mustBeLessOrEqualTo: 0 }
              - { metric: nullValues, mustBe: 0 }
expect:
  tables:
    - expectations:
        - { name: id_not_null, check: "`id` IS NOT NULL", action: warn }
        - {
            name: unit_invalidvalues,
            check: "`unit` IS NULL OR `unit` IN ('kg', 'o\\'z')",
            action: drop,
          }
        - {
            name: unit_known,
            check: "`unit` IS NOT NULL AND `unit` NOT IN ('', 'N/A')",
            action: drop,
          }
        - {
            name: unit_invalidvalues_2,
            check: "`unit` IS NULL OR `unit` RLIKE '^[a-z]+$'",
            action: drop,
          }
        - { name: unit_nullvalues, check: "`unit` IS NOT NULL", action: drop }
