description: With missingEnvvars information, a placeholder for an unset variable is not judged. A setting that holds one passes its schema and does not change a fixed value, and a name that holds one is not checked, so only the information remains and the tables resolve.
environment: dev
envvars: {}
missingEnvvars: information
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    naming:
      catalog: ${envvar:CATALOG}
    ingest:
      settings:
        files: { format: "${envvar:FORMAT}" }
    store:
      fixed:
        stream: { mode: append }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    store:
      with: { mode: "${envvar:MODE}" }
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        description: One row per order.
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  diagnostics:
    - { code: ENVVAR_MISSING, severity: information, file: sales.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: standard.yaml, line: 6 }
    - { code: ENVVAR_MISSING, severity: information, file: standard.yaml, line: 9 }
  tables:
    - name: orders
      fullName: ${envvar:CATALOG}.bronze.orders
      ingest: { method: files, settings: { format: "${envvar:FORMAT}" } }
      store: { method: stream, settings: { mode: append } } # the fixed value, applied last
