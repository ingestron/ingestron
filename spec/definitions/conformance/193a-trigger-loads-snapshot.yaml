description: A table whose ingest setting layout is snapshot is exempt from TRIGGER_KEY only when it is not incremental and each run replaces its rows, here a full reload kept with history latest and no primary key. A snapshot reloaded into a store with history none appends each reload, and an incremental snapshot overlaps rows, so both keep TRIGGER_KEY, an error at the trigger.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, ops@1]
    ingest:
      default: managed
    operations:
      schedule: { per: flow }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: sqlserver
    connectivity: public
    settings: { path: /data/erp }
  reload.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: reload
    source: erp
    ingest:
      with: { layout: snapshot }
      triggers:
        - name: weekly
          type: schedule
          every: { frequency: Week, interval: 1 }
          start: 2026-12-01T00:00:00Z
          parameters: { load: full }
    tables:
      kept: { object: kept, contract: events, history: latest }
      appended: { object: appended, contract: orders, history: none }
  windows.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: windows
    source: erp
    ingest:
      with: { layout: snapshot }
      triggers:
        - name: hourly
          type: tumbling-window
          every: { frequency: Hour, interval: 1 }
          start: 2026-12-01T00:00:00Z
    tables:
      windowed: { object: windowed, contract: orders, load: { mode: incremental }, history: none }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  events.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: events
    version: 1.0.0
    status: draft
    schema:
      - name: events
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true }
expect:
  diagnostics:
    - code: TRIGGER_KEY
      severity: error
      file: reload.yaml
      line: 8
      message: '"weekly" reloads or overlaps rows of appended, whose store keeps every row as it arrived (`history: none`), so overlapping rows would be duplicated.'
    - code: TRIGGER_KEY
      severity: error
      file: windows.yaml
      line: 8
      message: '"hourly" reloads or overlaps rows of windowed, whose store keeps every row as it arrived (`history: none`), so overlapping rows would be duplicated.'
