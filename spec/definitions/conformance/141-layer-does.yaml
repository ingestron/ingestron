description: "A table's does is its layer's: raw, or the list as written. A layer without does gives its tables none."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
      - { name: silver, does: [cleanse, check] }
      - gold
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  a_daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: daily
  b_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    inputs: [daily]
    code: "SELECT * FROM {{ tables.daily }}"
    contract: top
    layer: gold
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
  top.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: top
    version: 1.0.0
    status: draft
    schema:
      - name: top
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - name: orders
      layer: bronze
      does: raw
    - name: daily
      layer: silver
      does: [cleanse, check]
    - name: top
      layer: gold
      does: null
