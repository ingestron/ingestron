description: With features ga, a value its judging pack uses through a feature in preview is PREVIEW_FEATURE, a warning where the value was written, with a fix that allows preview features. The model lists it in previewFeatures.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    features: ga
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders, load: { mode: changes } }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  previewFeatures:
    - table: orders
      path: load.mode
      value: changes
      pack: test
      status:
        level: preview
        label: Beta
        checked: "2026-11-09"
        source: "https://example.com/changes"
  diagnostics:
    - code: PREVIEW_FEATURE
      severity: warning
      file: sales.yaml
      line: 6
      message: "load.mode: changes is Beta on test (checked 2026-11-09); this standard uses only generally available features."
      fixes: [Allow preview features]
  fixed:
    - diagnostic: 0
      title: Allow preview features
      files:
        standard.yaml: |
          apiVersion: ingestron.io/v1
          kind: Standard
          id: acme
          packs: [test@1]
          features: preview
