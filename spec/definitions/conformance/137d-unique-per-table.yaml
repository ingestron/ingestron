description: "Case 137c with a column's unique: true, which both packs declare used and only one needs checks for. The table kept by the pack that declares no checks capability gets the unique table check; the one kept by the pack that declares it gets none, and its unique is CAPABILITY_OFF about that table, reported once (sections 6 and 7.1)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, quality@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  lake.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: lake
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  counted.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: counted
    source: source
    ingest: { uses: quality-copy }
    store: { uses: quality-counts }
    tables:
      orders_counted: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        quality:
          - { metric: rowCount, mustBeGreaterThan: 0 }
        properties:
          - { name: id, logicalType: integer, unique: true }
expect:
  diagnostics:
    - code: CAPABILITY_OFF
      severity: warning
      file: orders.odcs.yaml
      line: 10
      subject: { table: orders, feature: checks }
    - code: CAPABILITY_OFF
      severity: warning
      file: orders.odcs.yaml
      line: 12
      message: 'unique in contract "orders" is not applied: the platform has Checks off.'
      hint: "Turn it on with manage.checks in platform.yaml. It needs: SELECT on the tables."
      fixes: [Turn on manage.checks]
      subject: { table: orders, feature: checks }
  tables:
    - name: orders_counted
      contract:
        tableChecks:
          - {
              name: orders_rowcount,
              metric: rowCount,
              columns: [],
              operator: mustBeGreaterThan,
              value: 0,
              unit: rows,
              action: warn,
            }
          - {
              name: id_unique,
              metric: duplicateValues,
              columns: [id],
              operator: mustBe,
              value: 0,
              unit: rows,
              action: warn,
            }
    - name: orders
      contract:
        tableChecks: []
        unchecked:
          - {
              name: orders_rowcount,
              reason: "it counts all rows, which is checked only when the platform turns on checks",
              notEnforced: CAPABILITY_OFF,
            }
          - {
              name: id_unique,
              reason: "it counts all rows, which is checked only when the platform turns on checks",
              notEnforced: CAPABILITY_OFF,
            }
