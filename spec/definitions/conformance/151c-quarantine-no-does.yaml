description: "A layer that gives no does asks nothing of its tables: the standard's quarantine is silent there, but quarantine written on the layer or the table itself reaches the table."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { default: drop, quarantine: true }
    layers:
      - bronze
      - name: silver
        quality: { quarantine: true }
      - gold
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive, check: total > 0 }
  a_clean.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: clean
    inputs: [orders]
    contract: orders
    expectations:
      - { name: small, check: total < 100 }
  b_top.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: top
    layer: gold
    inputs: [clean]
    contract: orders
    quality: { quarantine: true }
    expectations:
      - { name: small, check: total < 100 }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: total, logicalType: number, physicalType: "DECIMAL(18,2)" }
expect:
  tables:
    - name: orders
      quality: null
      quarantine: null
    - name: clean
      quality: { quarantine: true }
      quarantine:
        fullName: { schema: silver, table: clean_quarantine }
      qualityOrigins:
        quarantine: { layer: layer, file: standard.yaml, line: 9 }
    - name: top
      quality: { quarantine: true }
      quarantine:
        fullName: { schema: gold, table: top_quarantine }
      qualityOrigins:
        quarantine: { layer: definition, file: b_top.yaml, line: 7 }
  diagnostics: []
