description: A transform's history is a fact for rules, and a transform has no load fact, so a rule that names load never matches it.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    load: { default: full }
    store:
      when:
        - { load: full, layer: gold, use: view }
        - { history: latest, layer: gold, use: view }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  daily.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: daily
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: daily
    layer: gold
  weekly.yaml: |
    apiVersion: ingestron.io/v1
    kind: Transform
    id: weekly
    inputs: [orders]
    code: "SELECT * FROM {{ tables.orders }}"
    contract: weekly
    layer: gold
    history: latest
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  daily.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: daily
    version: 1.0.0
    status: draft
    schema:
      - name: daily
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
  weekly.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: weekly
    version: 1.0.0
    status: draft
    schema:
      - name: weekly
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
expect:
  tables:
    - name: orders
      store:
        method: stream
        chosenBy: { by: pack-default }
    - name: daily
      store:
        method: view
        chosenBy: { by: pack-rule, pack: test, when: { input: query } }
    - name: weekly
      store:
        method: view
        chosenBy:
          {
            by: standard-rule,
            when: { history: latest, layer: gold },
            file: standard.yaml,
            line: 9,
          }
