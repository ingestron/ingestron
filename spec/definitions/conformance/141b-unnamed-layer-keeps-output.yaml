description: "A standard that gives no does resolves as before: no table has does, the actions are as written, and nothing new is reported."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    quality: { required: fail, default: fail }
    layers: [bronze, silver]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    manage: { checks: true }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders:
        object: orders
        contract: orders
        expectations:
          - { name: positive, check: total > 0, action: fail }
          - { name: small, check: total < 100 }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true, unique: true }
          - name: total
            logicalType: number
            physicalType: "DECIMAL(18,2)"
            quality:
              - { metric: nullValues, mustBe: 0 }
expect:
  tables:
    - name: orders
      does: null
      expectations:
        - { name: id_not_null, action: fail }
        - { name: total_nullvalues, action: fail }
        - { name: positive, action: fail }
        - { name: small, action: fail }
      contract:
        tableChecks:
          - { name: id_unique, action: fail }
  diagnostics: []
