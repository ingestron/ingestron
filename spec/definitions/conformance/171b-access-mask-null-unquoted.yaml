description: "A mask written as an unquoted YAML null is the null mask (section 8.2)."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    governance:
      masks:
        restricted: null
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      payments: { object: payments, contract: payments }
  payments.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: payments
    version: 1.0.0
    status: draft
    schema:
      - name: payments
        logicalType: object
        properties:
          - { name: id, logicalType: integer, primaryKey: true }
          - { name: card, logicalType: integer, classification: restricted }
expect:
  tables:
    - name: payments
      access:
        grants: []
        exact: false
        masks: [{ column: card, classification: restricted, mask: "null" }]
        filters: []
