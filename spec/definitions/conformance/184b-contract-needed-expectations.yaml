description: "A flow table with its own expectations and no contract needs one, in a layer that does nothing about it: CONTRACT_NEEDED with the reason that it has its own expectations."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    layers:
      - { name: bronze, does: raw }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders:
        object: ERP.dbo.Orders
        expectations:
          - { name: positive, check: total > 0, action: warn }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: catalog, recipe: sqlserver, file: erp.csv }
        columns:
          - { name: id, sourceType: int, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - { name: total, sourceType: "decimal(18,2)", logicalType: number, required: false }
expect:
  diagnostics:
    - code: CONTRACT_NEEDED
      severity: error
      file: sales.yaml
      line: 7
      message: '"orders" needs a contract: it has its own expectations.'
