description: Column types come from physicalType or the standard's types; keys follow primaryKeyPosition.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    types: { number: 'DECIMAL(38,6)' }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: region, logicalType: string, primaryKey: true, primaryKeyPosition: 2 }
          - { name: id, logicalType: integer, primaryKey: true, primaryKeyPosition: 1 }
          - { name: rate, logicalType: number }
          - { name: total, logicalType: number, physicalType: 'DECIMAL(18,2)' }
expect:
  tables:
    - contract:
        primaryKey:
          - id
          - region
        columns:
          - name: region
            type: STRING
          - name: id
            type: BIGINT
          - name: rate
            type: DECIMAL(38,6)
          - name: total
            type: DECIMAL(18,2)
