description: "A metadata column that is an object with nested fields is one column with logicalType object and the type the packs give for it; its fields are not columns of the table."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {}, test: {}, prod: {} }
    imports: ["*.yaml", "sources/*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
    types: { object: STRING }
    layers:
      - { name: bronze, does: raw }
  erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: erp
    connector: files
    connectivity: public
    settings: { path: /data/erp }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: erp
    tables:
      orders: { object: ERP.dbo.Orders }
  sources/erp.yaml: |
    apiVersion: ingestron.io/v1
    kind: SourceMetadata
    id: erp
    connection: erp
    names: { parts: 3, caseSensitive: false }
    tables:
      - object: ERP.dbo.Orders
        captured: { at: 2026-11-12T09:30:00Z, from: document, file: orders.json }
        columns:
          - { name: id, logicalType: integer, required: true, primaryKeyPosition: 1 }
          - name: address
            logicalType: object
            required: false
            properties:
              - { name: city, logicalType: string, required: false }
              - { name: postcode, logicalType: string, required: false }
expect:
  diagnostics: []
  tables:
    - name: orders
      contract:
        columns:
          - { name: id, logicalType: integer, type: BIGINT, nullable: true }
          - { name: address, logicalType: object, type: STRING, nullable: true }
