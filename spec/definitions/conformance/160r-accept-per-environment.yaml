description: "A list written as accept: ${values.accept} accepts the warning in the environment whose values hold the entry: the entry is at the reference in the Platform."
environment: dev
files:
  project.yaml: |
    id: retail
    values:
      tags: false
      accept:
        - code: CAPABILITY_OFF
          about: { feature: tags }
          reason: The platform team applies the tags with its own Terraform.
    environments:
      dev: {}
      prod:
        values:
          tags: true
          accept: []
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    manage: { tags: "${values.tags}" }
    accept: "${values.accept}"
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, logicalType: string, tags: [pii] }
expect:
  diagnostics: []
  accepted:
    - code: CAPABILITY_OFF
      severity: warning
      file: orders.odcs.yaml
      line: 11
      subject: { table: orders, feature: tags }
      reason: The platform team applies the tags with its own Terraform.
      entry: { file: platform.yaml, line: 5 }
