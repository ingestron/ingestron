description: With the databricks section's pack named, a capability that is off is turned on in the section. When manage is written only at the top, the fix moves it to the section, as written, with the capability on, so the section and the top never disagree.
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [test@1, databricks@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    manage: { checks: true }
  shop.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: shop
    connector: files
    connectivity: public
    settings: { path: /data/shop }
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: shop
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - { name: email, logicalType: string, tags: [pii] }
expect:
  diagnostics:
    - code: PLATFORM_FIELD_MOVED
      severity: warning
      file: platform.yaml
      line: 4
      fixes: [Move to databricks.manage]
    - code: CAPABILITY_OFF
      severity: warning
      file: orders.odcs.yaml
      line: 11
      hint: "Turn it on with databricks.manage.tags in platform.yaml. It needs: APPLY TAG on the tables."
      fixes: [Turn on manage.tags]
  fixed:
    - diagnostic: 1
      title: Turn on manage.tags
      files:
        platform.yaml: |
          apiVersion: ingestron.io/v1
          kind: Platform
          id: lake
          databricks:
            manage:
              checks: true
              tags: true
