description: "A code that is no longer reported, CONTRACT_FIELD_UNUSED, is ACCEPT_CODE: there is nothing to accept."
environment: dev
files:
  project.yaml: |
    id: retail
    environments: { dev: {} }
    imports: ["*.yaml"]
  standard.yaml: |
    apiVersion: ingestron.io/v1
    kind: Standard
    id: acme
    packs: [quality@1]
  platform.yaml: |
    apiVersion: ingestron.io/v1
    kind: Platform
    id: lake
    accept:
      - code: CONTRACT_FIELD_UNUSED
        reason: The on-call team checks this rule from CI.
  source.yaml: |
    apiVersion: ingestron.io/v1
    kind: Connection
    id: source
    connector: quality
    connectivity: public
    settings: {}
  sales.yaml: |
    apiVersion: ingestron.io/v1
    kind: Flow
    id: sales
    source: source
    tables:
      orders: { object: orders, contract: orders }
  orders.odcs.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: orders
    version: 1.0.0
    status: draft
    schema:
      - name: orders
        logicalType: object
        properties:
          - { name: id, logicalType: integer, required: true, primaryKey: true }
          - name: code
            logicalType: string
            logicalTypeOptions: { maxLength: 8 }
            quality:
              - { metric: invalidValues, arguments: { pattern: "^[A-Z]+$" }, mustBe: 0 }
expect:
  diagnostics:
    - code: NOT_APPLIED
      severity: warning
      file: orders.odcs.yaml
      line: 15
      subject: { table: orders, feature: pattern }
    - code: ACCEPT_CODE
      severity: error
      file: platform.yaml
      line: 5
      message: '"CONTRACT_FIELD_UNUSED" is no longer reported, so there is nothing to accept.'
      hint: "Remove the entry. Follow the help for NOT_APPLIED."
      fixes: [Remove the entry]
  accepted: []
