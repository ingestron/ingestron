# Generated by Ingestron from the erp definitions (prod). Do not edit: change the definitions and generate again.
# Lakeflow Connect fields used here are marked Preview in the Databricks CLI v1.22.1 bundle schema (checked 2026-10-25).
resources:
  pipelines:
    erp_erp_ingestion:
      name: erp_erp_ingestion
      catalog: erp_prod
      schema: bronze
      serverless: true
      ingestion_definition:
        ingestion_gateway_id: ${resources.pipelines.erp_erp_gateway.id}
        objects:
          - table:
              source_catalog: erp
              source_schema: dbo
              source_table: Customers
              destination_catalog: erp_prod
              destination_schema: bronze
              destination_table: customers
              table_configuration:
                scd_type: SCD_TYPE_1
                include_columns:
                  - customer_id
                  - name
                  - country
                primary_keys:
                  - customer_id
          - table:
              source_catalog: erp
              source_schema: dbo
              source_table: Invoices
              destination_catalog: erp_prod
              destination_schema: bronze
              destination_table: invoices
              table_configuration:
                scd_type: SCD_TYPE_2
                include_columns:
                  - invoice_id
                  - customer_id
                  - amount
                  - status
                primary_keys:
                  - invoice_id
