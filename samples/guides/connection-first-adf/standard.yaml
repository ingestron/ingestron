apiVersion: ingestron.io/v1
kind: Standard
id: native
packs:
  - databricks@1
  - adf@1
ingest:
  settings:
    adf-table:
      start: 2026-10-01T00:00:00Z
      every:
        frequency: Hour
        interval: 24
  allowed:
    - adf-table
naming:
  catalog: sales_{{ environment }}
  schema: "{{ layer }}"
  pipeline: "{{ project }}_{{ environment }}"
store:
  allowed:
    - streaming-table
  fixed:
    streaming-table:
      cluster_by: auto
